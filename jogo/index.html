<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Missão Sistema Solar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: o espaço ocupa a tela toda; por cima, um painel de bordo (título, cartão do astro, fila de planetas). Mundo único, sempre escuro. */
  color-scheme: dark;
  --space:#060a1a;
  --panel:rgba(14,20,46,.88);
  --panel-solid:#10173a;
  --ink:#f5f0e3;
  --muted:#b3bbd8;
  --sun:#ffb938;
  --ice:#8fe3ff;
  --line:rgba(255,255,255,.16);
  --display:"Fredoka","Trebuchet MS","Segoe UI",sans-serif;
  --body:"Atkinson Hyperlegible","Verdana","Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--space);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;overflow:hidden}
#stage{position:relative;height:100%;width:100%;overflow:hidden;background:radial-gradient(120% 90% at 30% 20%,#101a44 0%,var(--space) 60%)}
#sky{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#sky:active{cursor:grabbing}
#tags{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;pointer-events:auto;font:600 14px/1 var(--display);color:var(--ink);background:rgba(6,10,26,.62);border:1px solid var(--line);border-radius:999px;padding:5px 10px;cursor:pointer;white-space:nowrap;will-change:transform}
.tag:hover{border-color:var(--sun);color:var(--sun)}

.hud{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"head panel" ". panel" "dock panel";gap:12px;padding:16px;pointer-events:none}
.hud>*{pointer-events:auto}

.head{grid-area:head;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;justify-self:start;pointer-events:none}
.head>*{pointer-events:auto}
h1{font:700 26px/1.05 var(--display);margin:0;letter-spacing:.01em;text-wrap:balance}
h1 span{color:var(--sun)}
.clock{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{font:600 15px/1 var(--display);color:var(--muted);background:none;border:0;border-radius:999px;padding:9px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--sun);color:#221400}
.elapsed{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}

.panel{grid-area:panel;align-self:start;max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:20px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.kind{display:inline-block;font:600 13px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:#06202b;background:var(--ice);border-radius:999px;padding:6px 10px}
.panel h2{font:700 38px/1 var(--display);margin:12px 0 8px;text-wrap:balance}
.lead{font-size:19px;margin:0 0 14px;max-width:34ch}
.facts{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:8px}
.facts li{border-left:4px solid var(--sun);padding:2px 0 2px 12px}
.data{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 16px}
.data div{background:rgba(255,255,255,.06);border-radius:12px;padding:9px 11px}
.data dt{font-size:13px;color:var(--muted)}
.data dd{margin:2px 0 0;font:600 17px/1.2 var(--display);font-variant-numeric:tabular-nums}
.you{border:1px dashed var(--line);border-radius:16px;padding:14px;margin:0 0 16px}
.you h3{font:600 18px/1.1 var(--display);margin:0 0 10px;color:var(--ice)}
.steppers{display:flex;flex-wrap:wrap;gap:10px 16px;margin-bottom:10px}
.stepper{display:flex;align-items:center;gap:8px;font-size:15px}
.stepper button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--ink);font:700 20px/1 var(--display);cursor:pointer}
.stepper output{min-width:62px;text-align:center;font:600 17px/1 var(--display);font-variant-numeric:tabular-nums}
.you p{margin:6px 0 0}
.you strong{color:var(--sun);font-family:var(--display);font-size:1.1em}
.nav{display:flex;flex-wrap:wrap;gap:8px}
a.btn{text-decoration:none;display:inline-block}
.btn{font:600 16px/1.1 var(--display);border-radius:999px;padding:12px 16px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--ink);cursor:pointer}
.btn.link{display:block;text-align:center;text-decoration:none}
a:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.btn.go{background:var(--sun);color:#221400;border-color:var(--sun);flex:1 1 auto}
.note{font-size:14px;color:var(--muted);margin:14px 0 0}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0 4px;padding:0;list-style:none}
.stamps li{display:grid;justify-items:center;align-content:start;gap:4px;font-size:11px;line-height:1.15;color:var(--muted);text-align:center}
.stamps .dot{width:30px;height:30px;opacity:.3;filter:grayscale(1)}
.stamps li.got{color:var(--ink)}
.stamps li.got .dot{opacity:1;filter:none;box-shadow:0 0 0 2px var(--sun)}
.done{background:var(--sun);color:#221400;border-radius:14px;padding:10px 12px;font:600 17px/1.25 var(--display);margin:12px 0 0}

.dockwrap{grid-area:dock;display:grid;gap:8px;padding:8px;background:var(--panel);border:1px solid var(--line);border-radius:20px;justify-self:start;max-width:100%;min-width:0}
.tabs{justify-self:start;background:rgba(255,255,255,.05)}
.dock{display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin;min-width:0}
.dot.const{background:radial-gradient(circle at 28% 30%,#fff 0 2px,transparent 3px),radial-gradient(circle at 72% 38%,#fff 0 2px,transparent 3px),radial-gradient(circle at 46% 74%,#fff 0 2.6px,transparent 3.6px),radial-gradient(circle at 76% 78%,#cfe2ff 0 1.6px,transparent 2.6px),#16224f;box-shadow:inset 0 0 0 1px var(--line)}
.tag.sky{border-color:rgba(143,227,255,.45);color:var(--ice)}
.tag.mini{font-size:12px;padding:4px 8px;pointer-events:none;color:var(--ink);border-color:var(--line)}
#cmp{display:block;width:100%;height:210px;border-radius:14px;background:#050814;margin:4px 0 14px}
.dock button{flex:0 0 auto;display:grid;justify-items:center;gap:5px;min-width:66px;padding:8px 6px 7px;border-radius:14px;border:1px solid transparent;background:none;color:var(--muted);font:600 13px/1 var(--display);cursor:pointer;position:relative}
.dock button:hover{color:var(--ink);background:rgba(255,255,255,.06)}
.dock button[aria-current="true"]{color:var(--ink);border-color:var(--sun);background:rgba(255,185,56,.12)}
.dock button.got::after{content:"";position:absolute;top:5px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--sun);border:2px solid var(--panel-solid)}
.dot{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 32% 30%,var(--c1),var(--c2) 72%)}


.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.voz{display:inline-flex;align-items:center;gap:8px;font:700 18px/1 var(--display);color:#221400;background:var(--sun);border:0;border-radius:999px;padding:10px 18px 10px 12px;cursor:pointer}
.voz svg{width:30px;height:30px;flex:none}
.voz[hidden]{display:none}
.voz.on{background:var(--ice);color:#06202b}
.say{transition:background-color .2s,box-shadow .2s;border-radius:8px}
.say.speaking{background:rgba(255,255,255,.07);box-shadow:0 0 0 5px rgba(255,255,255,.07)}
.w{border-radius:6px;padding:0 2px;margin:0 -2px}
.w.now{background:var(--sun);color:#221400;box-shadow:0 0 0 2px var(--sun)}
.tog{font:600 15px/1 var(--display);color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:11px 14px;cursor:pointer}
.tog[aria-pressed="true"]{color:var(--ink);border-color:var(--ice)}
.caps .say,.caps .dock button,.caps .tag,.caps .btn,.caps .you h3{text-transform:uppercase;letter-spacing:.02em}
.caps .lead{font-size:17px}
.caps .panel h2{font-size:34px}
.caps .facts li,.caps .you p{font-size:15.5px}
.pic{display:block;border-radius:50%;background-size:auto 100%;background-position:center;background-color:#222}
.p-saturno{position:relative}
.p-saturno::after{content:"";position:absolute;left:-24%;right:-24%;top:37%;height:26%;border:3px solid #dcc98f;border-radius:50%;transform:rotate(-16deg)}
.rocket{display:flex;align-items:center;justify-content:center;gap:3px;margin:8px 0 16px;min-height:64px}
.rk-mod{min-width:56px;height:56px;padding:0 8px;display:grid;place-items:center;border:2px dashed var(--line);border-radius:8px;font:700 22px/1 var(--display);color:rgba(245,240,227,.24)}
.rk-mod.f{border:2px solid #c9d2e8;background:#e8edf8;color:#16224f}
.rk-nose{width:32px;height:56px;background:#ff6b4a;clip-path:polygon(0 0,100% 50%,0 100%)}
.rk-flame{width:30px;height:30px;background:linear-gradient(90deg,rgba(255,185,56,0),#ffb938);clip-path:polygon(100% 0,0 50%,100% 100%);opacity:0;transform-origin:right center}
.rocket.go .rk-flame{opacity:1;animation:chama .22s infinite alternate}
.rocket.go{animation:voo 1.4s ease-in-out infinite alternate}
@keyframes voo{from{transform:translateX(-8px)}to{transform:translateX(12px)}}
@keyframes chama{from{transform:scaleX(.6)}to{transform:scaleX(1.3)}}
@media (prefers-reduced-motion:reduce){.rocket.go,.rocket.go .rk-flame{animation:none}}
.tile.syl{width:auto;min-width:62px;padding:0 12px;font-size:22px}
.tile.big{width:68px;height:72px;font-size:36px}
.tile[disabled]:not(.used){opacity:.28;cursor:default}
.bigword{font:700 44px/1.1 var(--display);text-align:center;letter-spacing:.06em;margin:8px 0 16px}
.opts.three{grid-template-columns:repeat(3,1fr)}
.slot.blank{border:2px solid var(--ice);background:rgba(143,227,255,.12)}
.slot.shown{border-style:solid;border-color:var(--line);color:var(--ink)}
.dot.ico.sm{font-size:12px}
.lvls{display:flex;align-items:center;gap:8px;margin:0 0 12px;font:600 14px/1 var(--display);color:var(--muted)}
.lvb{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--ink);font:700 16px/1 var(--display);cursor:pointer;padding:0}
.lvb[aria-pressed="true"]{background:var(--ice);color:#06202b;border-color:var(--ice)}
.lvb[disabled]{opacity:.3;cursor:default}
.pips{margin-left:auto;display:flex;gap:5px}
.pips i{width:12px;height:12px;border-radius:50%;border:2px solid var(--sun)}
.pips i.on{background:var(--sun)}
.lvb{font-size:22px;line-height:1}
.lvn{font:600 15px/1 var(--display);color:var(--ink)}
.lvn b{color:var(--ice);font-size:19px}
.slots.sm{gap:4px}
.slots.sm .slot{width:26px;height:38px;font-size:19px;border-radius:8px}
.slot.later{opacity:.45}
.bigword.sm{font-size:30px;letter-spacing:.02em}
.cstar.sm{width:30px;height:30px;margin:-15px 0 0 -15px;font-size:22px}
.duo.three{grid-template-columns:repeat(3,1fr)}
.duo.three .num{font-size:38px}
.opt.word{font-size:21px;padding:18px 6px;letter-spacing:.03em}
.pic.gone,.dot.gone{opacity:.2}
.sum .grpo.wide{max-width:210px}
.mtxt{font:700 13px/1.1 var(--display);overflow-wrap:anywhere}
.mrow{display:grid;gap:7px;width:100%;text-align:left;padding:10px 12px;margin:0 0 8px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);font:600 15px/1.1 var(--display);cursor:pointer}
.mrow small{font:600 12px/1 var(--display);color:var(--muted);float:right}
.mstars{display:flex;justify-content:space-between;position:relative}
.mstars::before{content:"";position:absolute;left:8px;right:8px;top:50%;height:2px;background:rgba(255,255,255,.14)}
.mstars i{position:relative;font-style:normal;font-size:20px;line-height:1;color:#3a4474;background:#131a3d;border-radius:50%;padding:0 1px}
.mstars i.on{color:var(--sun)}
.mstars i.cur{color:var(--ice)}
.bar{height:12px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin:0 0 12px}
.bar i{display:block;height:100%;background:var(--sun);border-radius:99px}
.tabs{max-width:100%;overflow-x:auto}
.buddy{grid-area:2/1;align-self:end;justify-self:start;background:none;border:0;padding:0;cursor:pointer;display:grid;justify-items:center;gap:2px;color:var(--ink);font:600 13px/1 var(--display)}
.buddy .astro{width:104px;height:auto;filter:drop-shadow(0 6px 14px rgba(0,0,0,.55))}
#bud3d{display:block;width:132px;height:172px;filter:drop-shadow(0 8px 16px rgba(0,0,0,.5))}
.mapbud img{width:100px;height:auto;flex:none}
.buddy span{background:rgba(6,10,26,.66);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.astro{display:block;animation:boia 3.2s ease-in-out infinite alternate}
.astro .eye{transform-box:fill-box;transform-origin:center;animation:pisca 4.2s infinite}
.astro .mo{display:none;transform-box:fill-box;transform-origin:center}
.astro .arm{transform-box:fill-box;transform-origin:50% 10%;transition:transform .25s}
.astro.talk .ms,.astro.oops .ms{display:none}
.astro.talk .mo{display:block;animation:fala .26s infinite alternate}
.astro.oops .mo{display:block}
.astro.oops .head{transform-box:fill-box;transform-origin:50% 90%;transform:rotate(9deg)}
.astro.happy{animation:pulo .42s ease-out infinite alternate}
.astro.happy .arm-l{transform:rotate(140deg)}
.astro.happy .arm-r{transform:rotate(-140deg)}
@keyframes boia{from{transform:translateY(-4px) rotate(-2deg)}to{transform:translateY(4px) rotate(2deg)}}
@keyframes pulo{from{transform:translateY(0)}to{transform:translateY(-14px)}}
@keyframes pisca{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes fala{from{transform:scaleY(.35)}to{transform:scaleY(1.25)}}
@media (prefers-reduced-motion:reduce){.astro,.astro.happy,.astro .eye,.astro.talk .mo{animation:none}}
.mapbud{display:flex;align-items:center;gap:14px;margin:10px 0 6px}
.mapbud .astro{width:96px;flex:none}
.mapbud h2{margin:0 0 4px}
.edit{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:10px 12px;margin:0 0 14px;font:600 14px/1 var(--display);color:var(--muted)}
.edit input{font:600 17px/1 var(--display);color:var(--ink);background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.edit input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.swb{width:32px;height:32px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:var(--c);cursor:pointer;padding:0}
.swb[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 3px var(--sun)}
.pmin{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:42px;margin:-10px 0 10px;padding:6px 2px;background:none;border:0;border-bottom:1px solid var(--line);color:var(--muted);font:600 14px/1 var(--display);cursor:pointer;text-align:left}
.pmin b{color:var(--ink);font-size:19px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pmin span{flex:none;border:1px solid var(--line);border-radius:999px;padding:7px 12px;color:var(--ink);background:rgba(255,255,255,.07)}
.panel.min{padding-top:8px;padding-bottom:8px;overflow:hidden}
.panel.min>*:not(.pmin){display:none}
.panel.min .pmin{margin:0;border-bottom:0}
.caps .pmin b{text-transform:uppercase;letter-spacing:.02em}
.looks{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:0 0 14px}
.lookb{aspect-ratio:1;border-radius:50%;border:2px solid transparent;background:none;padding:2px;cursor:pointer}
.lookb[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 3px var(--sun)}
.lookb .pic,.lookb .dot{width:100%;height:100%;display:block}
.dock .pic{width:34px;height:34px}
.tag.my{border-color:rgba(255,185,56,.6);color:var(--sun)}
.objrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 8px;font:600 15px/1.1 var(--display)}
.ghud{position:absolute;inset:0;display:none;flex-direction:column;justify-content:space-between;gap:10px;padding:12px;pointer-events:none}
.landing .ghud{display:flex}
.landing .hud,.landing #tags{display:none}
.ghud button,.ghud .joy,.gh-pal{pointer-events:auto}
.gh-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gh-name,.gh-st{font:700 19px/1 var(--display);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:10px 14px}
.gh-st{color:var(--sun)}
.gh-msg{align-self:center;margin:0;max-width:min(34ch,92%);text-align:center;background:rgba(6,10,26,.8);border:1px solid var(--line);border-radius:16px;padding:10px 14px;font:600 17px/1.3 var(--display);opacity:0;transition:opacity .25s;pointer-events:none}
.gh-msg.on{opacity:1}
.gh-bot{display:grid;gap:10px}
.gh-ctl{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.gh-tools{align-self:center;background:var(--panel)}
.joy{position:relative;flex:none;width:124px;height:124px;border-radius:50%;background:rgba(6,10,26,.5);border:2px solid rgba(255,255,255,.3);touch-action:none;cursor:grab}
.knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(245,240,227,.92);box-shadow:0 4px 10px rgba(0,0,0,.45);pointer-events:none}
.jumpb{flex:none;width:88px;height:88px;border-radius:50%;border:0;background:var(--sun);color:#221400;font:700 18px/1 var(--display);touch-action:none;cursor:pointer;box-shadow:0 6px 14px rgba(0,0,0,.45)}
.jumpb:active{transform:scale(.94)}
.gh-pal{display:flex;gap:6px;overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:8px;scrollbar-width:thin}
.pb{flex:0 0 auto;display:grid;justify-items:center;gap:4px;min-width:60px;padding:6px 4px 5px;border-radius:12px;border:2px solid transparent;background:none;color:var(--muted);font:600 11px/1 var(--display);cursor:pointer}
.pb[aria-pressed="true"]{border-color:var(--sun);background:rgba(255,185,56,.14);color:var(--ink)}
.pb img,.pb .oi{display:block;width:36px;height:36px;border-radius:7px;image-rendering:pixelated}
.pb .oi{display:grid;place-items:center;background:#1b2550;color:var(--ink);font:700 18px/1 var(--display)}
.caps .pb,.caps .gh-msg,.caps .gh-name{text-transform:uppercase}
@media (max-width:819px){
  .gh-ctl{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"tools tools tools" "joy . jump"}
  .gh-tools{grid-area:tools;justify-self:center}.joy{grid-area:joy;width:112px;height:112px}.jumpb{grid-area:jump;width:80px;height:80px}
  .gh-name,.gh-st{font-size:16px;padding:8px 12px}
}
.ovl{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(4,7,20,.8);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.ovl[hidden]{display:none}
.ovl-card{width:min(440px,100%);max-height:100%;overflow:auto;background:var(--panel-solid);border:1px solid var(--line);border-radius:22px;padding:22px}
.ovl-card.wide{width:min(780px,100%)}
.ovl-card h2{font:700 28px/1.1 var(--display);margin:0 0 8px;text-wrap:balance}
.ovl-card h3{font:600 17px/1.1 var(--display);color:var(--ice);margin:22px 0 10px}
.ovl-card .astro,.ovl-card img.bp{display:block;width:110px;height:auto;margin:0 auto 10px}
.ovl-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.prow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.prow input{font:600 16px/1 var(--display);color:var(--ink);background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:10px;padding:9px 11px;flex:1 1 140px;min-width:0}
.prow .tag2{font:600 12px/1 var(--display);color:#06202b;background:var(--ice);border-radius:999px;padding:5px 9px}
.btn.sm{padding:9px 12px;font-size:14px}
.danger{border-color:#ff8f7a!important;color:#ffb3a5!important}
.skill{display:grid;grid-template-columns:minmax(118px,1.1fr) 2fr minmax(104px,auto);align-items:center;gap:10px;padding:6px 0;font-size:15px}
.skill .bar{margin:0}
.skill small{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.days{display:flex;align-items:flex-end;gap:8px;height:110px;margin:4px 0}
.days div{flex:1;display:grid;grid-template-rows:auto 1fr auto;justify-items:center;gap:4px;font-size:12px;color:var(--muted);height:100%;font-variant-numeric:tabular-nums}
.days i{align-self:end;display:block;width:100%;background:var(--ice);border-radius:6px 6px 2px 2px;min-height:2px}
.days div.hoje i{background:var(--sun)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:0}
.kpis div{background:rgba(255,255,255,.06);border-radius:12px;padding:10px 12px}
.kpis dt{font-size:13px;color:var(--muted)}.kpis dd{margin:4px 0 0;font:700 19px/1.15 var(--display)}
.hl{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.hl li{border-left:4px solid var(--ice);padding:2px 0 2px 12px}
.hl li.up{border-color:var(--sun)}
.gq{font:700 42px/1 var(--display);text-align:center;margin:10px 0 14px;font-variant-numeric:tabular-nums}
.gform{display:flex;gap:8px;margin:0 0 10px}
.gform input{flex:1;min-width:0;font:700 24px/1 var(--display);text-align:center;color:var(--ink);background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:12px;padding:12px}
.acf label[for]{display:block;font-weight:700;margin:0 0 6px}
.acf input[type=email]{width:100%;font:600 18px/1.2 var(--body,inherit);color:var(--ink);background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 12px}
.consent{border:2px solid var(--sun);border-radius:14px;padding:12px;margin:0 0 10px;background:rgba(255,200,60,.07)}
.consent p{margin:0 0 8px}
.consent label{display:flex;gap:10px;align-items:flex-start;margin:0 0 8px;font-size:15px}
.consent input{width:22px;height:22px;flex:0 0 auto;margin:1px 0 0;accent-color:var(--sun)}
.consent a{color:var(--ice)}
.gerr{color:#ffb3a5;min-height:1.3em;margin:0 0 6px;text-align:center}
.whos{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:12px 0 4px}
.whos button{display:grid;justify-items:center;gap:6px;padding:12px 8px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);font:700 18px/1.1 var(--display);cursor:pointer}
.whos .astro{width:84px;margin:0}
input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
@media (max-width:600px){.skill{grid-template-columns:1fr auto;}.skill .bar{grid-column:1/-1;order:3}}
.grp{font:600 15px/1 var(--display);color:var(--ice);margin:14px 0 8px;letter-spacing:.04em;text-transform:uppercase}
.tiles.five{display:grid;grid-template-columns:repeat(5,1fr);justify-items:center}
.tiles.five .tile{width:auto;min-width:50px;padding:0 6px;font-size:23px}
.cboard{position:relative;aspect-ratio:4/3;background:#050814;border-radius:14px;margin:0 0 14px;overflow:hidden}
.cstar{position:absolute;width:36px;height:36px;margin:-18px 0 0 -18px;border:0;background:none;color:#cfe2ff;font:400 27px/1 var(--display);cursor:pointer;padding:0}
.cstar.on{color:var(--sun)}
.sum{display:flex;align-items:center;justify-content:center;gap:10px;margin:6px 0 4px}
.sum .grpo{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:130px}
.sum .pic,.sum .dot{width:30px;height:30px}
.sum b{font:700 30px/1 var(--display);color:var(--sun)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 14px}
.duo .opt{min-height:150px;align-content:center}
.duo .num{font:700 54px/1 var(--display);color:var(--ice)}
.duo small{font:600 14px/1 var(--display);color:var(--muted)}
.opt.right{border-color:var(--sun);background:rgba(255,185,56,.14)}
.opt.right[disabled]{opacity:1}
.dot.ico{display:grid;place-items:center;background:var(--sun);color:#221400;font:700 19px/1 var(--display)}
.gstars{font:700 18px/1 var(--display);color:var(--sun);margin:12px 0 8px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 14px}
.opt{display:grid;justify-items:center;gap:6px;padding:12px 8px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--ink);font:600 15px/1.1 var(--display);cursor:pointer}
.opt .pic,.opt .dot{width:56px;height:56px}
.opt[disabled]{opacity:.28;cursor:default}
.hero{width:88px;height:88px;margin:4px auto 10px}
.slots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px 0 14px}
.slot{width:36px;height:46px;border-radius:10px;border:2px dashed var(--line);display:grid;place-items:center;font:700 26px/1 var(--display);color:rgba(245,240,227,.24)}
.slot.f{border-style:solid;border-color:var(--sun);color:var(--ink);background:rgba(255,185,56,.14)}
.tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:0 0 16px}
.tile{width:48px;height:52px;border-radius:12px;border:0;background:var(--ice);color:#06202b;font:700 26px/1 var(--display);cursor:pointer}
.tile.used{visibility:hidden}
.tile.bad{background:#ff9a85}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 14px}
.mcard{aspect-ratio:3/4;border-radius:12px;border:1px solid var(--line);background:repeating-linear-gradient(45deg,#1a2558,#1a2558 6px,#141d48 6px,#141d48 12px);color:var(--ink);font:600 11px/1.1 var(--display);cursor:pointer;display:grid;justify-items:center;align-content:center;gap:5px;padding:4px}
.mcard.open{background:#0b1030;border-color:var(--ice)}
.mcard.done{border-color:var(--sun);background:#0b1030}
.mcard .pic,.mcard .dot{width:68%;height:auto;aspect-ratio:1}
.board{position:relative;aspect-ratio:1/1;background:#050814;border-radius:14px;margin:0 0 14px;overflow:hidden}
.board svg{position:absolute;inset:0;width:100%;height:100%}
.lstar{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:2px solid var(--ice);background:#0b1030;color:var(--ice);font:700 13px/1 var(--display);cursor:pointer;padding:0}
.lstar.on{background:var(--sun);border-color:var(--sun);color:#221400}
.lstar.next{box-shadow:0 0 0 5px rgba(143,227,255,.28)}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.fail{position:absolute;left:16px;top:30%;width:min(46ch,calc(100% - 32px));margin:0;color:var(--muted)}

@media (max-width:819px){
  body{font-size:16px}
  .caps .panel h2{font-size:28px}
  .caps .lead{font-size:16px}
  .hud{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-areas:"head" "." "panel" "dock";padding:12px;gap:10px}
  h1{font-size:21px}
  .seg button{padding:8px 11px;font-size:14px}
  .panel{align-self:end;max-height:38vh;padding:16px;border-radius:18px}
  .panel h2{font-size:30px;margin-top:10px}
  .lead{font-size:17px}
  .dockwrap{justify-self:stretch}
  .buddy{justify-self:end}
  .buddy .astro{width:64px}
  #bud3d{width:86px;height:112px}
  .buddy span{display:none}
  .playing .panel{max-height:60vh}
  .tabs button{padding:8px 9px;font-size:13px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}

<body>
<div id="stage">
  <canvas id="sky" aria-label="Sistema Solar em 3D. Arraste para girar e use a fila de planetas para viajar."></canvas>
  <div id="tags"></div>
  <div class="hud">
    <header class="head">
      <h1>Missão <span>Sistema Solar</span></h1>
      <div class="clock">
        <div class="seg" role="group" aria-label="Velocidade do tempo">
          <button type="button" id="sp0" data-speed="0" aria-pressed="false">Parar</button>
          <button type="button" id="sp1" data-speed="1" aria-pressed="true">Devagar</button>
          <button type="button" id="sp2" data-speed="8" aria-pressed="false">Rápido</button>
        </div>
        <button type="button" class="tog" id="btn-pais" data-pa="open">Área dos pais</button>
        <button type="button" class="tog" id="btn-caps" aria-pressed="true" title="Mostrar os textos em letra de forma (maiúscula)">Letra de forma</button>
        <button type="button" class="tog" id="btn-real" aria-pressed="false" title="Mostrar os tamanhos e as distâncias na proporção de verdade">Escala real</button>
        <span class="elapsed" id="elapsed">Passou 0 dias na Terra</span>
      </div>
    </header>
    <button type="button" class="buddy" id="buddy" aria-label="Seu astronauta. Toque para ouvir."></button>
    <section class="panel" id="panel" aria-live="polite"></section>
    <nav class="dockwrap" id="dockwrap" aria-label="Escolha um lugar para visitar">
      <div class="seg tabs" role="group" aria-label="O que explorar">
        <button type="button" id="tab-sistema" data-tab="sistema" aria-pressed="true">Planetas</button>
        <button type="button" id="tab-ceu" data-tab="ceu" aria-pressed="false">Estrelas</button>
        <button type="button" id="tab-cmp" data-tab="cmp" aria-pressed="false">Tamanhos</button>
        <button type="button" id="tab-jogos" data-tab="jogos" aria-pressed="false">Jogos</button>
        <button type="button" id="tab-mapa" data-tab="mapa" aria-pressed="false">Mapa</button>
        <button type="button" id="tab-meu" data-tab="meu" aria-pressed="false">Criar</button>
      </div>
      <div class="dock" id="dock"></div>
    </nav>
  </div>
  <div class="ghud" id="ghud">
    <div class="gh-top">
      <button type="button" class="btn go" id="gh-up" data-gh="up" style="flex:0 0 auto">▴ Decolar</button>
      <span class="gh-name" id="gh-name"></span>
      <span class="gh-st" id="gh-st"></span>
    </div>
    <p class="gh-msg" id="gh-msg" aria-live="polite"></p>
    <div class="gh-bot">
      <div class="gh-ctl">
        <div class="joy" id="joy" role="img" aria-label="Controle para andar: arraste a bolinha"><span class="knob" id="knob"></span></div>
        <div class="seg gh-tools" role="group" aria-label="O que o toque na tela faz">
          <button type="button" id="gh-explorar" data-gh="tool" data-v="explorar" aria-pressed="true">Explorar</button>
          <button type="button" id="gh-colocar" data-gh="tool" data-v="colocar" aria-pressed="false">Colocar</button>
          <button type="button" id="gh-tirar" data-gh="tool" data-v="tirar" aria-pressed="false">Tirar</button>
        </div>
        <button type="button" class="jumpb" id="gh-jump" aria-label="Pular">Pular</button>
      </div>
      <div class="gh-pal" id="gh-pal" role="group" aria-label="Blocos e objetos"></div>
    </div>
  </div>
  <div class="ovl" id="who" hidden><div class="ovl-card" id="who-body"></div></div>
  <div class="ovl" id="rest" hidden><div class="ovl-card" id="rest-body"></div></div>
  <div class="ovl" id="pais" role="dialog" aria-modal="true" aria-label="Área dos pais" hidden><div class="ovl-card wide" id="pais-body"></div></div>
  <div class="ovl" id="conta" role="dialog" aria-modal="true" aria-label="Conta da família" hidden><div class="ovl-card" id="conta-body"></div></div>
  <div class="ovl" id="gate" role="dialog" aria-modal="true" aria-label="Só para adultos" hidden><div class="ovl-card" id="gate-body"></div></div>
</div>

  var list=set.filter(function(c,i){return (!sp[2]||i<6)&&(sp[1]||(c[0]!=="lua"&&c[0]!=="iss"));}),cur=draw("d"+L,list),sky=sp[0]===2;
  var others=shuffle(BODIES.filter(function(b){return (!!b.grupo===sky)&&b.id!==cur[0];}).map(function(b){return b.id;})).slice(0,Math.max(0,sp[1]-1));

function newWord(){
  var L=LVL("palavra"),sp=[null,[3,3,1,0],[4,5,1,0],[6,6,1,0],[7,7,1,0],[8,11,1,0],[3,5,0,0],[6,7,0,0],[8,11,0,0],[6,7,0,2],[8,11,0,2]][L];

  if(sp[3])base=base.concat(shuffle("ABDEGILMNOPRSTU".split("").filter(function(c){return w[0].indexOf(c)<0;})).slice(0,sp[3]));
  do{tiles=shuffle(base.slice());}while(tiles.slice(0,w[0].length).join("")===w[0]);
  G.p={w:w,n:0,ghost:!!sp[2],tiles:tiles.map(function(ch){return {ch:ch,used:false};}),bad:-1,done:false};

function newFoguete(){
  var L=LVL("foguete"),sp=[null,[2,1,0],[3,1,0],[3,1,1],[4,1,0],[2,0,0],[3,0,0],[4,0,0],[3,0,1],[4,0,1],[4,0,2]][L];
  var w=draw("f"+L,VOC.filter(function(x){return x[1].length===sp[0]&&x[0]!=="MERCÚRIO";})),base=w[1].slice(),tiles;
  if(sp[2]){var all=[];VOC.forEach(function(x){if(x[0]!=="MERCÚRIO")x[1].forEach(function(sy){if(w[1].indexOf(sy)<0&&all.indexOf(sy)<0&&sy.length>1)all.push(sy);});});base=base.concat(shuffle(all).slice(0,sp[2]));}

  G.f={w:w,n:0,ghost:!!sp[1],tiles:tiles.map(function(x){return {s:x,used:false};}),bad:-1,done:false};

function newInicial(){
  var L=LVL("inicial"),sp=[null,["i",2],["i",3],["i",4],["i",5],["f",3],["f",4],["f",5],["si",3],["si",4],["sf",4]][L],syl=sp[0].length===2,fim=sp[0]==="f"||sp[0]==="sf";
  var w=draw("i"+L,VOC.filter(function(x){return !syl||x[1].length>1;})),c=syl?(fim?w[1][w[1].length-1]:w[1][0]):(fim?w[0][w[0].length-1]:w[0][0]),pool=[];

  else pool="ABCDEFGJLMNOPRSTUV".split("").filter(function(x){return x!==c;});

}

function newMemory(){
  var L=LVL("memoria"),sp=[null,[2,0,0],[3,0,0],[4,0,0],[5,0,0],[6,0,0],[8,0,0],[6,1,0],[8,1,0],[8,1,1],[10,1,0]][L];
  var ids=["sol","terra","lua","marte","jupiter","saturno","venus","netuno","urano","mercurio"].slice(0,sp[0]),cards=[];
  ids.forEach(function(id){cards.push({id:id,kind:"img",open:false,done:false},{id:id,kind:sp[1]?"txt":"img",open:false,done:false});});

function newLigue(){
  var L=LVL("ligue"),sp=[null,[0,"n"],[1,"n"],[2,"n"],[0,"a"],[1,"a"],[2,"a"],[1,"2"],[2,"2"],[1,"5"],[2,"r"]][L],len=LIGUE[sp[0]].ordem.length,labels=[];
  for(var k=0;k<len;k++)labels.push(sp[1]==="n"?k+1:sp[1]==="a"?"ABCDEFGHIJKLM"[k]:sp[1]==="2"?2*(k+1):sp[1]==="5"?5*(k+1):len-k);
  G.l={k:sp[0],mode:sp[1],labels:labels,n:0,done:false};

function ligueSay(l,k){var v=l.labels[k];return l.mode==="a"?"a letra "+(LETRA[v]||v):"o número "+numWord(v);}
function newRegressiva(){
  var sp=[null,[5,1,5],[10,1,10],[15,1,10],[20,1,10],[20,1,20],[20,2,10],[19,2,10],[50,5,10],[100,10,10],[100,5,10]][LVL("regressiva")],seq=[];
  for(var i=0;i<sp[2];i++)seq.push(sp[0]-i*sp[1]);
  G.r={seq:seq,step:sp[1],n:0,tiles:shuffle(seq.slice()).map(function(x){return {n:x,used:false};}),bad:-1,done:false};
}
function newContar(){
  var rg=[null,[1,5],[3,8],[5,10],[8,12],[10,15],[12,20],[15,24],[18,28],[20,30],[25,35]][LVL("contar")],n=rnd(rg[0],rg[1]),big=rg[1]>24,cols=big?7:6,rows=big?5:4,idx=[];
  for(var i=0;i<cols*rows;i++)idx.push(i);
  G.c={n:n,sm:big,pts:shuffle(idx).slice(0,n).map(function(c){return [(c%cols+.5)/cols*100+rnd(-2,2),(Math.floor(c/cols)+.5)/rows*100+rnd(-3,3)];}),tap:[],opts:shuffle([n].concat(near(n))),wrong:[],ok:false};
}
function newSoma(){
  var sp=[null,["+",5,1],["+",7,1],["+",10,1],["+",10,0],["-",5,1],["-",10,1],["-",10,0],["+",15,0],["+",20,0],["±",20,0]][LVL("soma")],op=sp[0]==="±"?(Math.random()<.5?"+":"-"):sp[0],a,b;
  if(op==="+"){a=rnd(1,sp[1]-1);b=rnd(1,sp[1]-a);}else{a=rnd(2,sp[1]);b=rnd(1,a-1);}
  var res=op==="+"?a+b:a-b;
  G.s={a:a,b:b,op:op,res:res,draw:!!sp[2],obj:["lua","terra","sol","marte"][rnd(0,3)],opts:shuffle([res].concat(near(res))),wrong:[],ok:false};
}
function newMaior(){
  var sp=[null,["size"],["num",2,5],["num",2,10],["num",2,20],["mix",2,20],["num",3,20],["num",3,50],["num",3,100],["num",4,50],["num",4,100]][LVL("maior")],t=sp[0]==="mix"?(Math.random()<.5?"num":"moon"):sp[0];
  var g={type:t,ok:false,miss:false},more=Math.random()<.5,vals;
  if(t==="size"){var ids=Object.keys(KM),A,B,ra;do{A=ids[rnd(0,ids.length-1)];B=ids[rnd(0,ids.length-1)];ra=KM[A]/KM[B];}while(A===B||(ra<1.4&&ra>1/1.4));
    g.items=[A,B];vals=[KM[A],KM[B]];g.q=more?"Qual é o maior?":"Qual é o menor?";}
  else if(t==="moon"){var ks=shuffle(Object.keys(LUAS)).slice(0,2);g.items=ks;vals=ks.map(function(k){return LUAS[k];});g.q=more?"Qual tem mais luas?":"Qual tem menos luas?";}
  else{var ns=[];while(ns.length<sp[1]){var x=rnd(1,sp[2]);if(ns.indexOf(x)<0)ns.push(x);}g.items=ns;vals=ns;g.q=more?"Qual número é o maior?":"Qual número é o menor?";}
  var best=0;vals.forEach(function(v,i){if(more?v>vals[best]:v<vals[best])best=i;});g.ans=best;
  if(t==="size")g.win=byId[g.items[best]].nome+(more?" é maior que ":" é menor que ")+byId[g.items[1-best]].nome+".";
  else if(t==="moon"){var txt=function(id){var n=LUAS[id];return byId[id].nome+(n===0?" não tem lua":n===1?" tem 1 lua":" tem "+n+" luas");};g.win=txt(g.items[0])+". "+txt(g.items[1])+".";}
  else g.win=g.items.length===2?g.items[best]+(more?" é maior que ":" é menor que ")+g.items[1-best]+".":g.items[best]+(more?" é o maior.":" é o menor.");
  G.g=g;
}
function startGame(id){
  state.game=id;G.up=0;
  ({desafio:newClue,palavra:newWord,memoria:newMemory,ligue:newLigue,inicial:newInicial,imagem:newImagem,falta:newFalta,foguete:newFoguete,regressiva:newRegressiva,contar:newContar,soma:newSoma,maior:newMaior})[id]();
}
/* ao abrir uma rodada: nos jogos em que a palavra não pode aparecer escrita, a voz fala a palavra; nos outros, lê o que está na tela */
function announce(){
  if(state.game==="inicial"&&G.i&&!G.i.ok)speakFree(G.i.w[2]+". "+iniAsk(G.i)+" "+G.i.w[2]+"?");
  else if(state.game==="falta"&&G.x&&!G.x.ok)speakFree(G.x.w[2]+". Qual letra falta?");
  else if(state.game==="foguete"&&G.f&&!G.f.done)speakFree("Vamos montar "+G.f.w[2]+". Toque nos pedaços na ordem certa.");
  else if(state.game==="palavra"&&G.p&&!G.p.done)speakFree("Vamos escrever "+G.p.w[2]+". Toque nas letras na ordem certa.");
  else speakPanel();
}

      '<button type="button" class="lvb" id="lv-next" data-lvl="'+(L.lvl+1)+'" aria-label="Próximo nível"'+(L.lvl>=L.max?' disabled title="Nível ainda fechado"':"")+'>›</button>'+pp+'</div>'+
      (G.up?'<p class="done say" id="say-up" style="margin:0 0 12px">Parabéns! Você abriu o nível '+G.up+'.</p>':'');
  }

  var ra0=0,de0=0;pts.forEach(function(s){ra0+=s[1]*15;de0+=s[2];});ra0/=pts.length;de0/=pts.length;
  var c0=Math.cos(de0*Math.PI/180),xy=pts.map(function(s){return [-(s[1]*15-ra0)*c0,-(s[2]-de0)];}),mxy=0;
  xy.forEach(function(q){mxy=Math.max(mxy,Math.abs(q[0]),Math.abs(q[1]));});

function gameAct(act,v,btnId){
  if(/-(next|new)$/.test(act))applyUp();
  var win=function(n){addStars(n||1);won();redraw("g-next");speakPanel();buddy("happy",G.up?3600:2200);};
  var miss=function(g,val){errStat();if(g.wrong.indexOf(val)<0)g.wrong.push(val);};
  if(act==="rank"){var rk=RANKS[+v];speakFree(rk[1]+". "+(G.stars>=rk[0]?"Você já conquistou essa patente.":"Precisa de "+rk[0]+" estrelas."));}
  else if(act==="unlock"){GAMES.forEach(function(g){lv(g.id).max=MAXLV;});saveLv();redraw("g-unlock");speakFree("Todos os níveis estão abertos.");}
  else if(act==="hear"){
    var hw=state.game==="inicial"?G.i.w[2]:state.game==="imagem"?byId[G.w.id].nome:state.game==="falta"?G.x.w[2]:state.game==="foguete"?G.f.w[2]:state.game==="palavra"?G.p.w[2]:"";
    if(hw)speakFree(hw+".");
  }
  else if(act==="d-pick"){
    var d=G.d;if(d.ok)return;
    if(v===d.cur[0]){d.ok=true;addStars(1);won();state.focus=byId[v].i;if(flyTo)flyTo(state.focus);redraw("g-next");}
    else{if(d.opts.indexOf(v)>=0)miss(d,v);else errStat();d.last=byId[v];redraw();}
    speakPanel();buddy(d.ok?"happy":"oops",d.ok?2200:1400);
  }else if(act==="d-next"){newClue();state.focus=-1;if(flyTo)flyTo(-1);redraw();speakPanel();}
  else if(act==="p-tile"){
    var p=G.p,w=p.w[0],t=p.tiles[+v];if(!t||t.used||p.done)return;
    if(t.ch===w[p.n]){t.used=true;p.n++;p.bad=-1;if(p.n===w.length){p.done=true;win();}else{redraw();speakFree("Letra "+(LETRA[t.ch]||t.ch)+".");}}
    else{errStat();p.bad=+v;redraw(btnId);speakFree("Ainda não. Procure a letra "+(LETRA[w[p.n]]||w[p.n])+".");}
  }else if(act==="p-next"){newWord();redraw();announce();}
  else if(act==="m-flip"){
    var m=G.m,c=m.cards[+v];if(!c||m.lock||c.open||c.done)return;
    c.open=true;var open=m.cards.filter(function(q){return q.open&&!q.done;}),name=byId[c.id].nome,said=(!m.txt||c.kind==="img")?name+".":"";
    if(open.length<2){redraw(btnId);if(said)speakFree(said);return;}
    if(open[0].id===open[1].id){open[0].done=open[1].done=true;open[0].open=open[1].open=false;
      if(m.cards.every(function(q){return q.done;})){m.won=true;win(2);}
      else{redraw(btnId);speakFree(name+". Você achou um par!");}}
    else{m.lock=true;redraw(btnId);if(said)speakFree(said);
      setTimeout(function(){if(G.m!==m)return;open[0].open=open[1].open=false;m.lock=false;if(inGame("memoria"))redraw();},1300);}
  }else if(act==="m-new"){newMemory();redraw();speakPanel();}
  else if(act==="l-tap"){
    var l=G.l;if(l.done)return;
    if(+v===l.n){l.n++;if(l.n===l.labels.length){l.done=true;win();}else{redraw("ls-"+l.n);var lb=l.labels[l.n-1];speakFree((l.mode==="a"?(LETRA[lb]||lb):numWord(lb))+".");}}
    else if(+v>l.n){errStat();speakFree("Procure "+ligueSay(l,l.n)+".");}
  }else if(act==="l-next"){newLigue();redraw();speakPanel();}
  else if(act==="i-pick"){
    var gi=G.i;if(gi.ok)return;
    if(v===gi.c){gi.ok=true;win();}
    else{miss(gi,v);redraw();speakFree(gi.syl?"Esse pedaço é: "+v.toLowerCase()+". Tente outro.":"Essa é a letra "+(LETRA[v]||v)+". Tente outra.");}
  }else if(act==="i-next"){newInicial();redraw();announce();}
  else if(act==="w-pick"){
    var gw=G.w;if(gw.ok)return;
    if(v===gw.id){gw.ok=true;win();}
    else{miss(gw,v);redraw();speakFree((gw.txt?"Aí está escrito: ":"Essa imagem é: ")+byId[v].nome+". Tente de novo.");}
  }else if(act==="w-next"){newImagem();redraw();announce();}
  else if(act==="x-pick"){
    var gx=G.x;if(gx.ok)return;
    if(v===gx.w[0][gx.blanks[gx.cur]]){gx.cur++;
      if(gx.cur===gx.blanks.length){gx.ok=true;win();}
      else{faltaOpts(gx);redraw();speakFree("Letra "+(LETRA[v]||v)+". Agora a próxima.");}}
    else{miss(gx,v);redraw();speakFree("Ainda não. Tente outra letra.");}
  }else if(act==="x-next"){newFalta();redraw();announce();}
  else if(act==="f-tile"){
    var gf=G.f,sy=gf.w[1],tf=gf.tiles[+v];if(!tf||tf.used||gf.done)return;
    if(tf.s===sy[gf.n]){tf.used=true;gf.n++;gf.bad=-1;if(gf.n===sy.length){gf.done=true;win();}else{redraw();speakFree(tf.s.toLowerCase()+".");}}
    else{errStat();gf.bad=+v;redraw(btnId);speakFree("Ainda não. Procure: "+sy[gf.n].toLowerCase()+".");}
  }else if(act==="f-next"){newFoguete();redraw();announce();}
  else if(act==="r-tile"){
    var r=G.r,rt=r.tiles[+v];if(!rt||rt.used||r.done)return;var want=r.seq[r.n];
    if(rt.n===want){rt.used=true;r.n++;r.bad=-1;if(r.n===r.seq.length){r.done=true;win();}else{redraw();speakFree(numWord(rt.n)+".");}}
    else{errStat();r.bad=+v;redraw(btnId);speakFree("Ainda não. Procure o número "+numWord(want)+".");}
  }else if(act==="r-next"){newRegressiva();redraw();speakPanel();}
  else if(act==="c-star"){var cc=G.c;if(cc.ok||cc.tap.indexOf(+v)>=0)return;cc.tap.push(+v);redraw(btnId);speakFree(numWord(cc.tap.length)+".");}
  else if(act==="c-pick"){var c2=G.c;if(c2.ok)return;
    if(+v===c2.n){c2.ok=true;win();}else{miss(c2,+v);c2.tap=[];redraw();speakFree("Ainda não. Conte de novo, tocando em cada estrela.");}
  }else if(act==="c-next"){newContar();redraw();speakPanel();}
  else if(act==="s-pick"){var sm=G.s;if(sm.ok)return;
    if(+v===sm.res){sm.ok=true;win();}else{miss(sm,+v);redraw();speakFree(sm.draw?"Ainda não. Conte os desenhos de novo.":"Ainda não. Tente outro número.");}
  }else if(act==="s-next"){newSoma();redraw();speakPanel();}
  else if(act==="gm-pick"){var gm=G.g;if(gm.ok)return;
    if(+v===gm.ans){gm.ok=true;gm.miss=false;win();}else{errStat();gm.miss=true;redraw();speakPanel();buddy("oops",1400);}
  }else if(act==="gm-next"){newMaior();redraw();speakPanel();}
}

    if(ids.length===2){var a=ptrs[ids[0]],b=ptrs[ids[1]],d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch)zoom(pinch/d);pinch=d;if(down)down.moved=true;}
  });
  var ray=new T.Raycaster(),ndc=new T.Vector2();
  function up(e){
    if(MY.on){MY.walk=null;
      if(MY.mode==="build"&&ptrs[e.pointerId]&&down&&!down.moved&&Date.now()-down.t<600){
        var rc2=canvas.getBoundingClientRect();ndc.set((e.clientX-rc2.left)/rc2.width*2-1,-((e.clientY-rc2.top)/rc2.height)*2+1);
        ray.setFromCamera(ndc,camera);var h2=ray.intersectObjects(MY.picks,false);if(h2.length)meuEvent("pick",h2[0].object.userData.i);}
      else if(MY.mode==="land"&&ptrs[e.pointerId]&&down&&!down.moved&&Date.now()-down.t<600)landTap(e.clientX,e.clientY);
      delete ptrs[e.pointerId];pinch=0;return;}
    if(ptrs[e.pointerId]&&down&&!down.moved&&Date.now()-down.t<600){
      var rc=canvas.getBoundingClientRect();ndc.set((e.clientX-rc.left)/rc.width*2-1,-((e.clientY-rc.top)/rc.height)*2+1);
      ray.setFromCamera(ndc,camera);var hit=ray.intersectObjects(picks,false);
      if(hit.length)select(hit[0].object.userData.i);
    }
    delete ptrs[e.pointerId];pinch=0;
  }
  canvas.addEventListener("pointerup",up);canvas.addEventListener("pointercancel",function(e){delete ptrs[e.pointerId];pinch=0;MY.walk=null;});
  canvas.addEventListener("wheel",function(e){e.preventDefault();zoom(Math.exp(e.deltaY*.0012));},{passive:false});
  window.addEventListener("resize",function(){measure();if(state.sel<0&&!fly.userZoom){radius=overviewR();fly.r1=radius;}});

  var v=new T.Vector3(),last=performance.now(),lastElapsed="";
  function frame(now){
    var dt=Math.min(.05,(now-last)/1000);last=now;
    simDays+=dt*speed*(365.25/24);
    objs.forEach(function(o){var b=o.b;
      if(b.id==="iss"){o.ang=(o.ang==null?o.a0:o.ang)+dt*.5*(speed>0?1:0);var ia=o.ang,INC=.9;
        o.pivot.position.set(Math.cos(ia)*b.orbit,Math.sin(ia)*b.orbit*Math.sin(INC),Math.sin(ia)*b.orbit*Math.cos(INC));o.mesh.rotation.y=-ia;}
      else if(b.orbit){var a=o.a0+6.2832*simDays/b.period;o.pivot.position.set(Math.cos(a)*b.orbit,0,Math.sin(a)*b.orbit);
        if(b.id==="lua")o.mesh.rotation.y=-a;}
      if(b.spin&&o.mesh)o.mesh.rotation.y+=dt*b.spin*(speed>0?1:0);
    });
    scene.updateMatrixWorld(true);
    objs.forEach(function(o){o.pivot.getWorldPosition(o.pos);});
    if(MY.on)myTick(dt);

    var cs=state.sel>=0?state.sel:state.focus,goal=MY.on?(MY.fpos?v.copy(MY.fpos):v.set(0,0,0)):(cs<0?v.set(0,0,0):v.copy(objs[cs].pos));
    if(fly.t<1){fly.t=Math.min(1,fly.t+dt/fly.dur);var e=fly.t<.5?4*fly.t*fly.t*fly.t:1-Math.pow(-2*fly.t+2,3)/2;
      target.lerpVectors(fly.from,goal,e);if(!fly.userZoom)radius=fly.r0+(fly.r1-fly.r0)*e;
      if(fly.a1){theta=fly.a0.theta+fly.dth*e;phi=fly.a0.phi+(fly.a1.phi-fly.a0.phi)*e;}}
    else target.copy(goal);
    if(MY.on&&MY.mode==='land'){wantX=0;wantY=0;}
    offX+=(wantX-offX)*Math.min(1,dt*5);offY+=(wantY-offY)*Math.min(1,dt*5);
    camera.setViewOffset(W,H,offX,offY,W,H);
    if(MY.on&&MY.mode==="pilot")pilotTick(dt);
    else if(MY.on&&MY.mode==="land")landTick(dt,now);
    else{var sp=Math.sin(phi);
      camera.position.set(target.x+radius*sp*Math.sin(theta),target.y+radius*Math.cos(phi),target.z+radius*sp*Math.cos(theta));
      camera.lookAt(target);}
    camera.updateMatrixWorld(true);
    renderer.render(MY.on&&MY.mode==='land'&&LS.scene?LS.scene:scene,camera);

    var pxPer=(H/2)/TAN;
    for(var i=0;i<objs.length;i++){var o=objs[i],el=tags[i],d=camera.position.distanceTo(o.pos);
      v.copy(o.pos).project(camera);
      var hide=MY.on||v.z>1||v.z<-1||i===state.sel&&fly.t>.6||(o.b.id==="lua"&&d>120)||(o.b.id==="iss"&&d>60)||d<o.b.r*1.2||(!o.b.grupo&&d>(REALM?2600:900));
      if(hide){if(el.style.display!=="none")el.style.display="none";continue;}
      if(el.style.display==="none")el.style.display="";
      var sx=(v.x*.5+.5)*W,sy=(-v.y*.5+.5)*H-(o.b.grupo==="const"?Math.min(150,o.b.size*.55/d*pxPer):o.b.r/d*pxPer)-8;
      el.style.transform="translate("+sx.toFixed(1)+"px,"+sy.toFixed(1)+"px) translate(-50%,-100%)";
    }
    for(var mi=0;mi<MY.tags.length;mi++){var mq=MY.pl[mi],me=MY.tags[mi],ms=!!mq&&MY.mode==="build"&&!(mi===MY.focus&&fly.t>.6);
      if(ms){v.copy(mq.pos).project(camera);ms=v.z<1&&v.z>-1;}
      if(!ms){if(me.style.display!=="none")me.style.display="none";continue;}
      if(me.style.display==="none")me.style.display="";
      me.style.transform="translate("+((v.x*.5+.5)*W).toFixed(1)+"px,"+((-v.y*.5+.5)*H-mq.rad/camera.position.distanceTo(mq.pos)*pxPer-8).toFixed(1)+"px) translate(-50%,-100%)";}
    for(var m=0;m<miniTags.length;m++){var mt=miniTags[m],show=mt.i===state.sel&&fly.t>.55;
      if(show){v.copy(mt.pos).project(camera);show=v.z<1&&v.z>-1;}
      if(!show){if(mt.el.style.display!=="none")mt.el.style.display="none";continue;}
      if(mt.el.style.display==="none")mt.el.style.display="";
      mt.el.style.transform="translate("+((v.x*.5+.5)*W).toFixed(1)+"px,"+((-v.y*.5+.5)*H-12).toFixed(1)+"px) translate(-50%,-100%)";}
    if(!reduce)for(var q=0;q<twinkle.length;q++)twinkle[q].opacity=.72+.28*Math.sin(now*.001*(1.3+q*.55)+q*2.1);
    var days=Math.floor(simDays),yrs=Math.floor(days/365.25),txt=yrs>=1?"Passou "+fmt(yrs)+(yrs===1?" ano":" anos")+" na Terra":"Passou "+days+(days===1?" dia":" dias")+" na Terra";
    if(yrs>1)txt="Passaram "+fmt(yrs)+" anos na Terra";
    if(txt!==lastElapsed){elapsedEl.textContent=txt;lastElapsed=txt;}
    requestAnimationFrame(frame);
  }
  measure();radius=overviewR();fly.r1=radius;offX=wantX;offY=wantY;
  if(state.sel>=0){target.copy(objs[state.sel].pivot.position);flyTo(state.sel);}
  requestAnimationFrame(frame);
}

/* ---------- Início ---------- */
function start(saved){
  if(saved&&typeof saved.sel==="number"&&saved.sel>=-1&&saved.sel<BODIES.length){state.sel=saved.sel;if(state.sel>=0)state.tab=tabOf(BODIES[state.sel]);}
  applyCaps();renderBuddy();try{initBud3D();}catch(e){bud3d=null;renderBuddy();}
  renderDock();renderPanel();
  try{boot3D();}
  catch(e){
    if(window.console)console.warn("3D indisponível:",e&&e.message);
    $("sky").style.display="none";
    var p=document.createElement("p");p.className="fail";p.textContent="Este aparelho não conseguiu abrir o espaço em 3D. Os cartões dos planetas continuam funcionando: escolha um na fila aqui embaixo.";
    stage.insertBefore(p,stage.firstChild);
  }
  if(hot&&hot.snapshot)hot.snapshot(function(){return {sel:state.sel};});
  AC.boot(function(){if(PROF.list.length>1&&!pickedNow())showWho();else checkLimit();});
}
if(hot&&hot.ready)hot.ready(start);else start((hot&&hot.data)||{});
})();
</script>
