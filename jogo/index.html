<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Missão Sistema Solar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: o espaço ocupa a tela toda; por cima, um painel de bordo (título, cartão do astro, fila de planetas). Mundo único, sempre escuro. */
  color-scheme: dark;
  --space:#060a1a;
  --panel:rgba(14,20,46,.88);
  --panel-solid:#10173a;
  --ink:#f5f0e3;
  --muted:#b3bbd8;
  --sun:#ffb938;
  --ice:#8fe3ff;
  --line:rgba(255,255,255,.16);
  --display:"Fredoka","Trebuchet MS","Segoe UI",sans-serif;
  --body:"Atkinson Hyperlegible","Verdana","Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--space);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;overflow:hidden}
#stage{position:relative;height:100%;width:100%;overflow:hidden;background:radial-gradient(120% 90% at 30% 20%,#101a44 0%,var(--space) 60%)}
#sky{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#sky:active{cursor:grabbing}
#tags{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;pointer-events:auto;font:600 14px/1 var(--display);color:var(--ink);background:rgba(6,10,26,.62);border:1px solid var(--line);border-radius:999px;padding:5px 10px;cursor:pointer;white-space:nowrap;will-change:transform}
.tag:hover{border-color:var(--sun);color:var(--sun)}

.hud{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"head panel" ". panel" "dock panel";gap:12px;padding:16px;pointer-events:none}
.hud>*{pointer-events:auto}

.head{grid-area:head;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;justify-self:start;pointer-events:none}
.head>*{pointer-events:auto}
h1{font:700 26px/1.05 var(--display);margin:0;letter-spacing:.01em;text-wrap:balance}
h1 span{color:var(--sun)}
.clock{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{font:600 15px/1 var(--display);color:var(--muted);background:none;border:0;border-radius:999px;padding:9px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--sun);color:#221400}
.elapsed{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}

.panel{grid-area:panel;align-self:start;max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:20px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.kind{display:inline-block;font:600 13px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:#06202b;background:var(--ice);border-radius:999px;padding:6px 10px}
.panel h2{font:700 38px/1 var(--display);margin:12px 0 8px;text-wrap:balance}
.lead{font-size:19px;margin:0 0 14px;max-width:34ch}
.facts{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:8px}
.facts li{border-left:4px solid var(--sun);padding:2px 0 2px 12px}
.data{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 16px}
.data div{background:rgba(255,255,255,.06);border-radius:12px;padding:9px 11px}
.data dt{font-size:13px;color:var(--muted)}
.data dd{margin:2px 0 0;font:600 17px/1.2 var(--display);font-variant-numeric:tabular-nums}
.you{border:1px dashed var(--line);border-radius:16px;padding:14px;margin:0 0 16px}
.you h3{font:600 18px/1.1 var(--display);margin:0 0 10px;color:var(--ice)}
.steppers{display:flex;flex-wrap:wrap;gap:10px 16px;margin-bottom:10px}
.stepper{display:flex;align-items:center;gap:8px;font-size:15px}
.stepper button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--ink);font:700 20px/1 var(--display);cursor:pointer}
.stepper output{min-width:62px;text-align:center;font:600 17px/1 var(--display);font-variant-numeric:tabular-nums}
.you p{margin:6px 0 0}
.you strong{color:var(--sun);font-family:var(--display);font-size:1.1em}
.nav{display:flex;flex-wrap:wrap;gap:8px}
a.btn{text-decoration:none;display:inline-block}
.btn{font:600 16px/1.1 var(--display);border-radius:999px;padding:12px 16px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--ink);cursor:pointer}
.btn.link{display:block;text-align:center;text-decoration:none}
a:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.btn.go{background:var(--sun);color:#221400;border-color:var(--sun);flex:1 1 auto}
.note{font-size:14px;color:var(--muted);margin:14px 0 0}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0 4px;padding:0;list-style:none}
.stamps li{display:grid;justify-items:center;align-content:start;gap:4px;font-size:11px;line-height:1.15;color:var(--muted);text-align:center}
.stamps .dot{width:30px;height:30px;opacity:.3;filter:grayscale(1)}
.stamps li.got{color:var(--ink)}
.stamps li.got .dot{opacity:1;filter:none;box-shadow:0 0 0 2px var(--sun)}
.done{background:var(--sun);color:#221400;border-radius:14px;padding:10px 12px;font:600 17px/1.25 var(--display);margin:12px 0 0}

.dockwrap{grid-area:dock;display:grid;gap:8px;padding:8px;background:var(--panel);border:1px solid var(--line);border-radius:20px;justify-self:start;max-width:100%;min-width:0}
.tabs{justify-self:start;background:rgba(255,255,255,.05)}
.dock{display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin;min-width:0}
.dot.const{background:radial-gradient(circle at 28% 30%,#fff 0 2px,transparent 3px),radial-gradient(circle at 72% 38%,#fff 0 2px,transparent 3px),radial-gradient(circle at 46% 74%,#fff 0 2.6px,transparent 3.6px),radial-gradient(circle at 76% 78%,#cfe2ff 0 1.6px,transparent 2.6px),#16224f;box-shadow:inset 0 0 0 1px var(--line)}
.tag.sky{border-color:rgba(143,227,255,.45);color:var(--ice)}
.tag.mini{font-size:12px;padding:4px 8px;pointer-events:none;color:var(--ink);border-color:var(--line)}
#cmp{display:block;width:100%;height:210px;border-radius:14px;background:#050814;margin:4px 0 14px}
.dock button{flex:0 0 auto;display:grid;justify-items:center;gap:5px;min-width:66px;padding:8px 6px 7px;border-radius:14px;border:1px solid transparent;background:none;color:var(--muted);font:600 13px/1 var(--display);cursor:pointer;position:relative}
.dock button:hover{color:var(--ink);background:rgba(255,255,255,.06)}
.dock button[aria-current="true"]{color:var(--ink);border-color:var(--sun);background:rgba(255,185,56,.12)}
.dock button.got::after{content:"";position:absolute;top:5px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--sun);border:2px solid var(--panel-solid)}
.dot{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 32% 30%,var(--c1),var(--c2) 72%)}


.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.voz{display:inline-flex;align-items:center;gap:8px;font:700 18px/1 var(--display);color:#221400;background:var(--sun);border:0;border-radius:999px;padding:10px 18px 10px 12px;cursor:pointer}
.voz svg{width:30px;height:30px;flex:none}
.voz[hidden]{display:none}
.voz.on{background:var(--ice);color:#06202b}
.say{transition:background-color .2s,box-shadow .2s;border-radius:8px}
.say.speaking{background:rgba(255,255,255,.07);box-shadow:0 0 0 5px rgba(255,255,255,.07)}
.w{border-radius:6px;padding:0 2px;margin:0 -2px}
.w.now{background:var(--sun);color:#221400;box-shadow:0 0 0 2px var(--sun)}
.tog{font:600 15px/1 var(--display);color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:11px 14px;cursor:pointer}
.tog[aria-pressed="true"]{color:var(--ink);border-color:var(--ice)}
.caps .say,.caps .dock button,.caps .tag,.caps .btn,.caps .you h3{text-transform:uppercase;letter-spacing:.02em}
.caps .lead{font-size:17px}
.caps .panel h2{font-size:34px}
.caps .facts li,.caps .you p{font-size:15.5px}
.pic{display:block;border-radius:50%;background-size:auto 100%;background-position:center;background-color:#222}
.p-saturno{position:relative}
.p-saturno::after{content:"";position:absolute;left:-24%;right:-24%;top:37%;height:26%;border:3px solid #dcc98f;border-radius:50%;transform:rotate(-16deg)}
.rocket{display:flex;align-items:center;justify-content:center;gap:3px;margin:8px 0 16px;min-height:64px}
.rk-mod{min-width:56px;height:56px;padding:0 8px;display:grid;place-items:center;border:2px dashed var(--line);border-radius:8px;font:700 22px/1 var(--display);color:rgba(245,240,227,.24)}
.rk-mod.f{border:2px solid #c9d2e8;background:#e8edf8;color:#16224f}
.rk-nose{width:32px;height:56px;background:#ff6b4a;clip-path:polygon(0 0,100% 50%,0 100%)}
.rk-flame{width:30px;height:30px;background:linear-gradient(90deg,rgba(255,185,56,0),#ffb938);clip-path:polygon(100% 0,0 50%,100% 100%);opacity:0;transform-origin:right center}
.rocket.go .rk-flame{opacity:1;animation:chama .22s infinite alternate}
.rocket.go{animation:voo 1.4s ease-in-out infinite alternate}
@keyframes voo{from{transform:translateX(-8px)}to{transform:translateX(12px)}}
@keyframes chama{from{transform:scaleX(.6)}to{transform:scaleX(1.3)}}
@media (prefers-reduced-motion:reduce){.rocket.go,.rocket.go .rk-flame{animation:none}}
.tile.syl{width:auto;min-width:62px;padding:0 12px;font-size:22px}
.tile.big{width:68px;height:72px;font-size:36px}
.tile[disabled]:not(.used){opacity:.28;cursor:default}
.bigword{font:700 44px/1.1 var(--display);text-align:center;letter-spacing:.06em;margin:8px 0 16px}
.opts.three{grid-template-columns:repeat(3,1fr)}
.slot.blank{border:2px solid var(--ice);background:rgba(143,227,255,.12)}
.slot.shown{border-style:solid;border-color:var(--line);color:var(--ink)}
.dot.ico.sm{font-size:12px}
.lvls{display:flex;align-items:center;gap:8px;margin:0 0 12px;font:600 14px/1 var(--display);color:var(--muted)}
.lvb{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--ink);font:700 16px/1 var(--display);cursor:pointer;padding:0}
.lvb[aria-pressed="true"]{background:var(--ice);color:#06202b;border-color:var(--ice)}
.lvb[disabled]{opacity:.3;cursor:default}
.pips{margin-left:auto;display:flex;gap:5px}
.pips i{width:12px;height:12px;border-radius:50%;border:2px solid var(--sun)}
.pips i.on{background:var(--sun)}
.lvb{font-size:22px;line-height:1}
.lvn{font:600 15px/1 var(--display);color:var(--ink)}
.lvn b{color:var(--ice);font-size:19px}
.slots.sm{gap:4px}
.slots.sm .slot{width:26px;height:38px;font-size:19px;border-radius:8px}
.slot.later{opacity:.45}
.bigword.sm{font-size:30px;letter-spacing:.02em}
.cstar.sm{width:30px;height:30px;margin:-15px 0 0 -15px;font-size:22px}
.duo.three{grid-template-columns:repeat(3,1fr)}
.duo.three .num{font-size:38px}
.opt.word{font-size:21px;padding:18px 6px;letter-spacing:.03em}
.pic.gone,.dot.gone{opacity:.2}
.sum .grpo.wide{max-width:210px}
.mtxt{font:700 13px/1.1 var(--display);overflow-wrap:anywhere}
.mrow{display:grid;gap:7px;width:100%;text-align:left;padding:10px 12px;margin:0 0 8px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);font:600 15px/1.1 var(--display);cursor:pointer}
.mrow small{font:600 12px/1 var(--display);color:var(--muted);float:right}
.mstars{display:flex;justify-content:space-between;position:relative}
.mstars::before{content:"";position:absolute;left:8px;right:8px;top:50%;height:2px;background:rgba(255,255,255,.14)}
.mstars i{position:relative;font-style:normal;font-size:20px;line-height:1;color:#3a4474;background:#131a3d;border-radius:50%;padding:0 1px}
.mstars i.on{color:var(--sun)}
.mstars i.cur{color:var(--ice)}
.bar{height:12px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin:0 0 12px}
.bar i{display:block;height:100%;background:var(--sun);border-radius:99px}
.tabs{max-width:100%;overflow-x:auto}
.buddy{grid-area:2/1;align-self:end;justify-self:start;background:none;border:0;padding:0;cursor:pointer;display:grid;justify-items:center;gap:2px;color:var(--ink);font:600 13px/1 var(--display)}
.buddy .astro{width:104px;height:auto;filter:drop-shadow(0 6px 14px rgba(0,0,0,.55))}
#bud3d{display:block;width:132px;height:172px;filter:drop-shadow(0 8px 16px rgba(0,0,0,.5))}
.mapbud img{width:100px;height:auto;flex:none}
.buddy span{background:rgba(6,10,26,.66);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.astro{display:block;animation:boia 3.2s ease-in-out infinite alternate}
.astro .eye{transform-box:fill-box;transform-origin:center;animation:pisca 4.2s infinite}
.astro .mo{display:none;transform-box:fill-box;transform-origin:center}
.astro .arm{transform-box:fill-box;transform-origin:50% 10%;transition:transform .25s}
.astro.talk .ms,.astro.oops .ms{display:none}
.astro.talk .mo{display:block;animation:fala .26s infinite alternate}
.astro.oops .mo{display:block}
.astro.oops .head{transform-box:fill-box;transform-origin:50% 90%;transform:rotate(9deg)}
.astro.happy{animation:pulo .42s ease-out infinite alternate}
.astro.happy .arm-l{transform:rotate(140deg)}
.astro.happy .arm-r{transform:rotate(-140deg)}
@keyframes boia{from{transform:translateY(-4px) rotate(-2deg)}to{transform:translateY(4px) rotate(2deg)}}
@keyframes pulo{from{transform:translateY(0)}to{transform:translateY(-14px)}}
@keyframes pisca{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes fala{from{transform:scaleY(.35)}to{transform:scaleY(1.25)}}
@media (prefers-reduced-motion:reduce){.astro,.astro.happy,.astro .eye,.astro.talk .mo{animation:none}}
.mapbud{display:flex;align-items:center;gap:14px;margin:10px 0 6px}
.mapbud .astro{width:96px;flex:none}
.mapbud h2{margin:0 0 4px}
.edit{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:10px 12px;margin:0 0 14px;font:600 14px/1 var(--display);color:var(--muted)}
.edit input{font:600 17px/1 var(--display);color:var(--ink);background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.edit input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.swb{width:32px;height:32px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:var(--c);cursor:pointer;padding:0}
.swb[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 3px var(--sun)}
.pmin{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:42px;margin:-10px 0 10px;padding:6px 2px;background:none;border:0;border-bottom:1px solid var(--line);color:var(--muted);font:600 14px/1 var(--display);cursor:pointer;text-align:left}
.pmin b{color:var(--ink);font-size:19px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pmin span{flex:none;border:1px solid var(--line);border-radius:999px;padding:7px 12px;color:var(--ink);background:rgba(255,255,255,.07)}
.panel.min{padding-top:8px;padding-bottom:8px;overflow:hidden}
.panel.min>*:not(.pmin){display:none}
.panel.min .pmin{margin:0;border-bottom:0}
.caps .pmin b{text-transform:uppercase;letter-spacing:.02em}
.looks{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:0 0 14px}
.lookb{aspect-ratio:1;border-radius:50%;border:2px solid transparent;background:none;padding:2px;cursor:pointer}
.lookb[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 3px var(--sun)}
.lookb .pic,.lookb .dot{width:100%;height:100%;display:block}
.dock .pic{width:34px;height:34px}
.tag.my{border-color:rgba(255,185,56,.6);color:var(--sun)}
.objrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 8px;font:600 15px/1.1 var(--display)}
.ghud{position:absolute;inset:0;display:none;flex-direction:column;justify-content:space-between;gap:10px;padding:12px;pointer-events:none}
.landing .ghud{display:flex}
.landing .hud,.landing #tags{display:none}
.ghud button,.ghud .joy,.gh-pal{pointer-events:auto}
.gh-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gh-name,.gh-st{font:700 19px/1 var(--display);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:10px 14px}
.gh-st{color:var(--sun)}
.gh-msg{align-self:center;margin:0;max-width:min(34ch,92%);text-align:center;background:rgba(6,10,26,.8);border:1px solid var(--line);border-radius:16px;padding:10px 14px;font:600 17px/1.3 var(--display);opacity:0;transition:opacity .25s;pointer-events:none}
.gh-msg.on{opacity:1}
.gh-bot{display:grid;gap:10px;grid-template-columns:minmax(0,1fr);min-width:0}.gh-barra{min-width:0}.gh-pal{min-width:0}
.gh-ctl{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.gh-tools{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px}
.gh-tools button{display:flex;align-items:center;gap:6px;border:0;background:none;color:var(--muted);border-radius:999px;padding:9px 12px;font:700 14px/1 var(--display);cursor:pointer}
.gh-tools button[aria-pressed="true"]{background:var(--sun);color:#221400}
.gh-tools .ic,.gh-tabs .ic{font-size:18px;line-height:1}
.gh-right{display:flex;align-items:flex-end;gap:10px}
.gh-barra{display:grid;gap:8px}
.gh-top .ghup{flex:0 0 auto}
.ghmsgb{margin-left:auto;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:20px;cursor:pointer;position:relative}
.ghmsgb.new::after{content:"";position:absolute;top:4px;right:4px;width:11px;height:11px;border-radius:50%;background:var(--sun);border:2px solid var(--panel-solid);animation:pulso 1s ease-in-out 3}
@keyframes pulso{50%{transform:scale(1.5)}}
.gh-tabs button{position:relative;display:flex;align-items:center;gap:6px}
.gh-tabs .qt{position:absolute;right:-4px;top:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--sun);color:#221400;font:700 11px/18px var(--display);font-style:normal;padding:0 4px}
.joy{position:relative;flex:none;width:124px;height:124px;border-radius:50%;background:rgba(6,10,26,.5);border:2px solid rgba(255,255,255,.3);touch-action:none;cursor:grab}
.knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(245,240,227,.92);box-shadow:0 4px 10px rgba(0,0,0,.45);pointer-events:none}
.jumpb{flex:none;width:88px;height:88px;border-radius:50%;border:0;background:var(--sun);color:#221400;font:700 18px/1 var(--display);touch-action:none;cursor:pointer;box-shadow:0 6px 14px rgba(0,0,0,.45)}
.jumpb:active{transform:scale(.94)}
.gh-pal{display:flex;gap:6px;overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:8px;scrollbar-width:thin}
.pb{flex:0 0 auto;display:grid;justify-items:center;gap:4px;min-width:60px;padding:6px 4px 5px;border-radius:12px;border:2px solid transparent;background:none;color:var(--muted);font:600 11px/1 var(--display);cursor:pointer}
.pb[aria-pressed="true"]{border-color:var(--sun);background:rgba(255,185,56,.14);color:var(--ink)}
.pb img,.pb .oi{display:block;width:36px;height:36px;border-radius:7px;image-rendering:pixelated}
.pb .oi{display:grid;place-items:center;background:#1b2550;color:var(--ink);font:700 18px/1 var(--display)}
.caps .pb,.caps .gh-msg,.caps .gh-name{text-transform:uppercase}
@media (max-width:819px){
  .ghud{padding:10px;gap:8px}
  .gh-top .ghup{width:44px;height:44px;padding:0;border-radius:50%;font-size:20px}.ghup .tx,.gh-name{display:none}
  .gh-st{font-size:15px;padding:8px 12px}
  .gh-ctl{align-items:flex-end}.joy{width:104px;height:104px}
  .gh-right{flex-direction:column;align-items:flex-end;gap:8px}
  .gh-tools{flex-direction:column;border-radius:24px}.gh-tools button{width:44px;height:44px;justify-content:center;padding:0}.gh-tools .tx{display:none}
  .jumpb{width:72px;height:72px;font-size:15px}

/* Versão em 3D do astronauta: montado com formas simples, iluminado, com braços e cabeça que se mexem.
   Se o aparelho não abrir o 3D, fica o desenho plano acima. */
/* monta o boneco 3D do astronauta (usado no cantinho da tela e ao pousar em um planeta) */
function makeAstro(T){
  var lin=function(c){return new T.Color(c).convertSRGBToLinear();};
  var M=function(c,r,m){return new T.MeshStandardMaterial({color:lin(c),roughness:r==null?.45:r,metalness:m||0});};
  var white=M(0xf4f6fb,.38),grey=M(0xb9c3dc,.6),suit=M(BUD.suit,.38),skin=M(BUD.skin,.7),hair=M(BUD.hair,.85),dark=M(0x161616,.3);
  var S=function(r,mat,sx,sy,sz){var m=new T.Mesh(new T.SphereGeometry(r,30,22),mat);if(sx)m.scale.set(sx,sy,sz);return m;};
  var glow=function(c){return new T.MeshStandardMaterial({color:lin(c),emissive:lin(c),emissiveIntensity:.7,roughness:.4});};
  var root=new T.Group();root.scale.setScalar(.93);
  /* corpo, mochila e painel do peito */
  var body=S(.8,white,1,1.12,.86);body.position.y=-1.62;root.add(body);
  var pack=new T.Mesh(new T.BoxGeometry(1.05,1.1,.5),grey);pack.position.set(0,-1.5,-.62);root.add(pack);
  var chest=new T.Mesh(new T.BoxGeometry(.58,.36,.12),suit);chest.position.set(0,-1.48,.66);root.add(chest);
  [[-.16,0xffb938],[0,0x8fe3ff],[.16,0xffffff]].forEach(function(q){var l=S(.052,glow(q[1]));l.position.set(q[0],-1.48,.735);root.add(l);});
  var neck=new T.Mesh(new T.TorusGeometry(.5,.1,12,40),suit);neck.rotation.x=Math.PI/2;neck.position.y=-.9;root.add(neck);
  var belt=new T.Mesh(new T.TorusGeometry(.76,.06,10,44),suit);belt.rotation.x=Math.PI/2;belt.scale.set(1,.86,1);belt.position.y=-2.0;root.add(belt);
  /* pernas e botas */
  [-.3,.3].forEach(function(x){var leg=S(.25,white,1,1.7,1);leg.position.set(x,-2.5,0);root.add(leg);var boot=S(.27,suit,1.1,.7,1.5);boot.position.set(x,-2.9,.12);root.add(boot);});
  /* braços: giram no ombro */
  function arm(side){var g=new T.Group();g.position.set(side*.8,-1.18,0);var up=S(.21,white,1,2.1,1);up.position.y=-.4;g.add(up);
    var cuff=new T.Mesh(new T.TorusGeometry(.2,.05,8,24),suit);cuff.rotation.x=Math.PI/2;cuff.position.y=-.7;g.add(cuff);
    var hand=S(.25,suit);hand.position.y=-.9;g.add(hand);var thumb=S(.1,suit);thumb.position.set(-side*.2,-.86,.08);g.add(thumb);root.add(g);return g;}
  var armL=arm(-1),armR=arm(1);
  /* cabeça: capacete com abertura na frente, visor de vidro e o rosto lá dentro */
  var head=new T.Group();root.add(head);
  var shell=new T.Mesh(new T.SphereGeometry(1,44,30,0,6.2832,.74,Math.PI-.74),new T.MeshStandardMaterial({color:lin(0xf4f6fb),roughness:.32,side:T.DoubleSide}));shell.rotation.x=Math.PI/2;head.add(shell);
  var inner=new T.Mesh(new T.SphereGeometry(.975,32,20),new T.MeshStandardMaterial({color:lin(0x17245a),roughness:.9,side:T.BackSide}));head.add(inner);
  var rim=new T.Mesh(new T.TorusGeometry(Math.sin(.74),.075,12,52),suit);rim.position.z=Math.cos(.74);head.add(rim);
  var face=S(.7,skin);face.position.set(0,-.05,.12);head.add(face);
  var hairM=new T.Mesh(new T.SphereGeometry(.76,30,18,0,6.2832,0,1.2),hair);hairM.position.set(0,-.04,.1);hairM.rotation.x=-.22;head.add(hairM);
  var eyeL=S(.078,dark),eyeR=S(.078,dark);eyeL.position.set(-.25,-.02,.765);eyeR.position.set(.25,-.02,.765);head.add(eyeL);head.add(eyeR);
  [eyeL,eyeR].forEach(function(e){var h=S(.026,glow(0xffffff));h.position.set(.025,.03,.062);e.add(h);});
  [-1,1].forEach(function(sd){var ck=S(.1,M(0xff8f8f,.9),1,.6,.3);ck.position.set(sd*.42,-.22,.655);head.add(ck);});
  var smile=new T.Mesh(new T.TorusGeometry(.15,.03,8,24,Math.PI),dark);smile.rotation.z=Math.PI;smile.position.set(0,-.2,.79);head.add(smile);
  var mouth=S(.09,M(0x7a2a2a,.6),1,.8,.4);mouth.position.set(0,-.3,.765);mouth.visible=false;head.add(mouth);
  var visor=new T.Mesh(new T.SphereGeometry(.985,40,20,0,6.2832,0,.77),new T.MeshStandardMaterial({color:0xbfe0ff,roughness:.04,metalness:.35,transparent:true,opacity:.2,depthWrite:false}));visor.rotation.x=Math.PI/2;head.add(visor);
  [-1,1].forEach(function(sd){var ear=new T.Mesh(new T.CylinderGeometry(.21,.21,.18,22),suit);ear.rotation.z=Math.PI/2;ear.position.x=sd*1.02;head.add(ear);});
  var mast=new T.Mesh(new T.CylinderGeometry(.026,.026,.36,8),grey);mast.position.y=1.16;head.add(mast);
  var lampM=glow(0xffb938),lamp=S(.1,lampM);lamp.position.y=1.38;head.add(lamp);
  return {root:root,head:head,armL:armL,armR:armR,eyeL:eyeL,eyeR:eyeR,smile:smile,mouth:mouth,lampM:lampM,suit:suit,skin:skin,hair:hair,lin:lin};
}
function initBud3D(){
  var T=window.THREE,host=$("buddy");if(!T||!host||reduce)return;
  var cv=document.createElement("canvas");cv.id="bud3d";cv.setAttribute("aria-hidden","true");
  var R=new T.WebGLRenderer({canvas:cv,alpha:true,antialias:true});R.setPixelRatio(Math.min(window.devicePixelRatio||1,2));R.outputEncoding=T.sRGBEncoding;R.setClearColor(0x000000,0);
  var sc=new T.Scene(),cam=new T.PerspectiveCamera(28,132/172,.1,60);cam.position.set(0,-.72,10.2);cam.lookAt(0,-.72,0);
  sc.add(new T.HemisphereLight(0xffffff,0x3a4a90,1.15));
  var d1=new T.DirectionalLight(0xffffff,.9);d1.position.set(2.5,3,4);sc.add(d1);
  var d2=new T.DirectionalLight(0x8fb4ff,.6);d2.position.set(-3,1.5,-2);sc.add(d2);
  var A=makeAstro(T),root=A.root,head=A.head,armL=A.armL,armR=A.armR,eyeL=A.eyeL,eyeR=A.eyeR,smile=A.smile,mouth=A.mouth,lampM=A.lampM,suit=A.suit,skin=A.skin,hair=A.hair,lin=A.lin;sc.add(root);

  function size(){var w=cv.clientWidth||132,h=cv.clientHeight||172;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();}
  var cl=function(v,a,b){return Math.max(a,Math.min(b,v));};
  var t0=performance.now(),spin=0,last=null,yaw=0,pitch=0,blinkAt=2.2;
  function pose(now,m){
    var t=(now-t0)/1000,r=cv.getBoundingClientRect(),ty=0,tp=0;
    if(m!==last){if(m==="happy")spin=1;last=m;}
    if(budPtr.on){ty=cl((budPtr.x-(r.left+r.width/2))/420,-.7,.7);tp=cl((budPtr.y-(r.top+r.height*.3))/420,-.35,.42);}
    yaw+=(ty-yaw)*.08;pitch+=(tp-pitch)*.08;
    head.rotation.set(pitch,yaw,m==="oops"?.26:Math.sin(t*.9)*.03);
    root.rotation.y=yaw*.35+(spin>0?(1-spin)*6.2832:0);if(spin>0)spin=Math.max(0,spin-.024);
    root.position.y=Math.sin(t*1.3)*.07+(m==="happy"?Math.abs(Math.sin(t*8))*.22:0);
    root.rotation.z=Math.sin(t*.8)*.035;
    var wave=budWave>now||(!m&&(t%11)>9.3),lz=-.2,rz=.2,lx=Math.sin(t*1.1)*.08,rx=Math.sin(t*1.1+2)*.08;
    if(m==="happy"){lz=-2.5+Math.sin(t*5)*.12;rz=2.5-Math.sin(t*5)*.12;lx=rx=0;}
    else if(m==="oops"){lz=-.75;rz=.75;lx=rx=-.3;}
    else{
      if(m==="talk"){lz=-.38;lx=-.5+Math.sin(t*2.4)*.18;rz=.32;rx=-.35+Math.sin(t*2+1)*.14;}
      if(wave){rz=2.55+Math.sin(t*5.5)*.3;rx=0;}
    }
    armL.rotation.z+=(lz-armL.rotation.z)*.1;armR.rotation.z+=(rz-armR.rotation.z)*.1;armL.rotation.x+=(lx-armL.rotation.x)*.1;armR.rotation.x+=(rx-armR.rotation.x)*.1;
    var bl=(t>blinkAt&&t<blinkAt+.13)?.1:1;if(t>blinkAt+.13)blinkAt=t+2.5+Math.random()*3;eyeL.scale.y=eyeR.scale.y=bl;
    smile.visible=!(m==="talk"||m==="oops");mouth.visible=!smile.visible;
    if(m==="talk")mouth.scale.set(1,.45+Math.abs(Math.sin(t*11))*.8,.4);else mouth.scale.set(.8,.8,.4);
    lampM.emissiveIntensity=.5+Math.abs(Math.sin(t*2))*.6;
  }
  function frame(now){pose(now,budMood);R.render(sc,cam);requestAnimationFrame(frame);}
  host.innerHTML="";host.appendChild(cv);var lab=document.createElement("span");lab.textContent=BUD.nome||"Nico";host.appendChild(lab);
  size();window.addEventListener("resize",size);
  document.addEventListener("pointermove",function(e){budPtr.x=e.clientX;budPtr.y=e.clientY;budPtr.on=true;},{passive:true});
  document.addEventListener("pointerdown",function(e){budPtr.x=e.clientX;budPtr.y=e.clientY;budPtr.on=true;},{passive:true});
  bud3d={colors:function(){suit.color.copy(lin(BUD.suit));skin.color.copy(lin(BUD.skin));hair.color.copy(lin(BUD.hair));},
    /* retrato para o mapa: de frente, acenando */
    shot:function(){try{root.rotation.set(0,0,0);root.position.y=0;head.rotation.set(0,0,0);armL.rotation.set(0,0,-.2);armR.rotation.set(0,0,2.5);smile.visible=true;mouth.visible=false;eyeL.scale.y=eyeR.scale.y=1;
      R.render(sc,cam);return cv.toDataURL("image/png");}catch(e){return "";}}};
  requestAnimationFrame(frame);
}

/* Separa cada frase em palavras clicáveis pelo destaque e calcula o "peso" (tempo) de cada uma. */
function wrapWords(){
  voice.lines={};voice.order=[];voice.now=null;
  var els=panel.querySelectorAll(".say");
  for(var k=0;k<els.length;k++){(function(el){
    var words=[],walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null),nodes=[],n;
    while((n=walker.nextNode()))nodes.push(n);
    nodes.forEach(function(node){
      var parts=node.nodeValue.split(/(\s+)/),frag=document.createDocumentFragment();
      parts.forEach(function(p){
        if(!p)return;
        if(/^\s+$/.test(p)){frag.appendChild(document.createTextNode(p));return;}
        var sp=document.createElement("span");sp.className="w";sp.textContent=p;frag.appendChild(sp);words.push(sp);
      });
      node.parentNode.replaceChild(frag,node);
    });
    var text="",list=[],total=0;
    words.forEach(function(sp){
      var tok=falar(sp.textContent);
      var start=text.length+(text?1:0);text+=(text?" ":"")+tok;
      var u=(/\d/.test(tok)?tok.length*3:tok.length)+1;
      if(/[,;]$/.test(tok))u+=4;else if(/[.!?:]$/.test(tok))u+=7;
      list.push({el:sp,start:start,from:total});total+=u;
    });
    voice.lines[el.id]={els:[el],text:text,words:list,units:total};voice.order.push(el.id);
  })(els[k]);}
  /* O nome sozinho ("Sirius", "Rigel") pode ser lido em outro idioma. Junta o nome com a primeira frase, para a voz ter contexto em português. */
  if(voice.order.length>1&&voice.order[0]==="say-nome"){
    var A=voice.lines["say-nome"],B=voice.lines[voice.order[1]],pre=A.text+(/[.!?]$/.test(A.text)?" ":". "),du=A.units+7;
    B.words.forEach(function(w){w.start+=pre.length;w.from+=du;});
    A.text=pre+B.text;A.words=A.words.concat(B.words);A.units=du+B.units;A.els.push(B.els[0]);
    delete voice.lines[voice.order[1]];voice.order.splice(1,1);
  }
}
function setWord(L,i){
  var el=L&&L.words[i]?L.words[i].el:null;
  if(voice.now===el)return;
  if(voice.now)voice.now.classList.remove("now");
  voice.now=el;if(el)el.classList.add("now");
}
function mark(id){
  var old=panel.querySelectorAll(".speaking");for(var i=0;i<old.length;i++)old[i].classList.remove("speaking");
  var Lm=id&&voice.lines[id],el=Lm?Lm.els[0]:null;
  if(el){Lm.els.forEach(function(q){q.classList.add("speaking");});try{Lm.els[Lm.els.length-1].scrollIntoView({block:"nearest",behavior:reduce?"auto":"smooth"});}catch(e){}}
  else{setWord(null,-1);voice.cur=null;voice.clock=null;if(voice.timer){clearInterval(voice.timer);voice.timer=null;}}
  var was=voice.speaking;voice.speaking=!!el;if(was!==voice.speaking)vozButton();
}
function elapsed(){return voice.clock?voice.clock.ms+(performance.now()-voice.clock.base):0;}
/* Uma frase começou a ser falada: ajusta o ritmo com base na frase anterior e acende a primeira palavra. */
function startLine(id){
  var prev=voice.cur&&voice.lines[voice.cur];
  if(prev&&voice.clock&&prev.units>8){var ms=elapsed();if(ms>700)voice.mpu=Math.max(45,Math.min(150,.5*voice.mpu+.5*ms/prev.units));}
  voice.cur=id;voice.clock={ms:0,base:performance.now()};
  mark(id);voice.cur=id;setWord(voice.lines[id],0);
}
function tick(){
  if(!voice.cur||!voice.clock||voice.gotBoundary)return;
  var L=voice.lines[voice.cur];if(!L)return;
  var u=elapsed()/voice.mpu,i=0;
  while(i+1<L.words.length&&L.words[i+1].from<=u)i++;
  setWord(L,i);
}
function stopVoice(){
  voice.token++;
  try{if(voice.kind==="claude")voice.t.stop();else if(voice.kind==="web")window.speechSynthesis.cancel();}catch(e){}
  mark(null);
}
function speakPanel(){
  if(!voice.kind)return;
  stopVoice();var tok=++voice.token,lines=[];
  (voice.order||[]).forEach(function(id){var L=voice.lines[id];if(L&&L.text)lines.push({text:L.text,id:id});});
  if(!lines.length)return;
  var end=function(){if(tok===voice.token)mark(null);};
  voice.gotBoundary=false;voice.timer=setInterval(tick,50);
  if(voice.kind==="claude"){
    mark(lines[0].id);
    try{voice.t.speak(lines.map(function(l){return {text:l.text,id:l.id,language:"pt-BR",rate:RATE};}),{language:"pt-BR",rate:RATE}).then(end,function(err){
      if(err&&err.code==="not_granted"){voice.kind=null;vozButton();}end();});}catch(e){end();}
  }else{
    var pt=ptVoice||pickVoice();
    lines.forEach(function(l,i){
      var u=new SpeechSynthesisUtterance(l.text);u.lang=pt?pt.lang:"pt-BR";u.rate=RATE;if(pt)u.voice=pt;
      u.onstart=function(){if(tok===voice.token)startLine(l.id);};
      u.onboundary=function(e){
        if(tok!==voice.token||(e.name&&e.name!=="word"))return;
        var L=voice.lines[l.id];if(!L)return;voice.gotBoundary=true;
        var j=0;while(j+1<L.words.length&&L.words[j+1].start<=e.charIndex)j++;
        setWord(L,j);
      };
      u.onerror=end;if(i===lines.length-1)u.onend=end;
      window.speechSynthesis.speak(u);
    });
  }
}
if(window.claude&&typeof window.claude.use==="function"){
  try{window.claude.use("tts").then(function(t){
    if(!t)return;voice.t=t;voice.kind="claude";
    try{t.onLine(function(o){if(o&&o.id&&voice.lines[o.id]&&voice.speaking)startLine(o.id);});}catch(e){}
    try{t.onPosition(function(o){
      if(!o||typeof o.ms!=="number"||!voice.speaking)return;
      if(!voice.clock){var first=panel.querySelector(".speaking");if(first&&voice.lines[first.id]){voice.cur=first.id;}else return;}
      voice.clock={ms:o.ms,base:performance.now()};
    });}catch(e){}
    vozButton();
  },function(){});}catch(e){}
}
/* fala um texto curto (letra, número, nome) sem destaque na tela */
function speakFree(text){
  if(!voice.kind)return;stopVoice();++voice.token;
  if(voice.kind==="claude"){try{var pr=voice.t.speak([{text:text,language:"pt-BR",rate:RATE}],{language:"pt-BR",rate:RATE});if(pr&&pr.catch)pr.catch(function(){});}catch(e){}}
  else{var pt=ptVoice||pickVoice(),u=new SpeechSynthesisUtterance(text);u.lang=pt?pt.lang:"pt-BR";u.rate=RATE;if(pt)u.voice=pt;try{window.speechSynthesis.speak(u);}catch(e){}}
  buddy(/^(Ainda não|Essa |Esse |Aí está|Procure)/.test(text)?"oops":"talk",Math.max(1000,text.length*80));
}

function won(){var id=state.game,L=lv(id),need=NEED[id]||3;stat(id,"ok");
  if(G.ms&&G.ms.kind==="g"&&G.ms.game===id){G.ms.n++;stat(G.ms.sub+":"+id,"ok");}
  if(id==="memoria")diaAdd("memoria");
  if(L.lvl===L.max){if(L.max<MAXLV){L.wins++;if(L.wins>=need){L.max++;L.wins=0;G.up=L.max;}}else if(!L.full){L.wins++;if(L.wins>=need)L.full=true;}}
  saveLv();}

  if(!DIA||DIA.d!==k){var ex=["acertos","visita","estrela","blocos","memoria"],seed=0;for(var i=0;i<k.length;i++)seed+=k.charCodeAt(i)*(i+1);
    var t=ex[seed%ex.length];DIA={d:k,l:[{t:"pt",n:0},{t:"mt",n:0},{t:t,n:0}],bonus:false};store.set("dia",DIA);}
  return DIA;}

  D.l.forEach(function(x){var need=DIAT[x.t][1];if(x.t===t&&x.n<need){x.n=Math.min(need,x.n+(n||1));mud=true;if(x.n>=need){addStars(5);toast("Missão do dia cumprida! +5 ★");}}});

["pt","mt"].forEach(function(sub){var seen={};TRID[sub]=TRILHAS[sub].map(function(m){var b=sub+":"+m[1]+":"+m[2];seen[b]=(seen[b]||0)+1;return b+(seen[b]>1?":"+seen[b]:"");});});
function mNome(m){return m[1].indexOf("g:")===0?GNAME[m[1].slice(2)]+" · nível "+m[2]:SKN[m[1]]+(m[2]>1?" "+["","","II","III"][m[2]]:"");}
function mDone(sub,k){return TR.done[TRID[sub][k]]||0;}
function mOpen(sub,k){var L=TRILHAS[sub];if(TR.all||k===0||mDone(sub,k-1))return true;var ini=TR.inicio||0;
  return L[k][0]<ini||(L[k][0]===ini&&L[k-1][0]<ini);}
function mNext(sub){var L=TRILHAS[sub],ini=TR.inicio||0;for(var k=0;k<L.length;k++)if(L[k][0]>=ini&&mOpen(sub,k)&&!mDone(sub,k))return k;
  for(k=0;k<L.length;k++)if(mOpen(sub,k)&&!mDone(sub,k))return k;
  for(k=L.length-1;k>=0;k--)if(mOpen(sub,k))return k;return 0;}
function mCount(sub){return TRILHAS[sub].filter(function(m,k){return mDone(sub,k);}).length;}
function subNome(sub){return sub==="pt"?"Português":"Matemática";}
function stars3(n){var o="";for(var i=1;i<=3;i++)o+='<i class="'+(i<=n?"on":"")+'">★</i>';return '<span class="mst" aria-label="'+n+' de 3 estrelas">'+o+'</span>';}

/* ---------- Rodando uma missão ---------- */
function startMission(sub,k){
  var m=TRILHAS[sub][k];if(!m)return;
  var ms={sub:sub,k:k,m:m,id:TRID[sub][k],n:0,err:0,first:0,boost:0,streak:0,fim:false,q:null};
  if(m[1].indexOf("g:")===0){var gid=m[1].slice(2),L=lv(gid);L.max=Math.max(L.max,m[2]);L.lvl=m[2];saveLv();startGame(gid);ms.kind="g";ms.game=gid;ms.need=3;}
  else{state.game="q";ms.kind="q";ms.need=5;G.ms=ms;newQ();}
  G.ms=ms;state.trail=null;select(-3);announce();
}
function newQ(){var ms=G.ms,d=Math.max(1,Math.min(3,ms.m[2]+ms.boost)),q=SK[ms.m[1]](d);q.wrong=[];q.ok=false;q.first=true;q.miss=0;ms.q=q;}
function skKey(ms){return ms.sub+":"+(ms.kind==="g"?ms.game:ms.m[1]);}
/* planetas da área Criar: o primeiro é livre; cada novo abre a cada 5 missões cumpridas (no máximo 8) */
var MISS_PLANETA=5;
function missFeitas(){return mCount("pt")+mCount("mt");}
function planetasLib(){return Math.min(8,1+Math.floor(missFeitas()/MISS_PLANETA));}
function faltaPlaneta(){return Math.max(1,MISS_PLANETA*MEU.planets.length-missFeitas());}
function finishMission(){
  var ms=G.ms;if(!ms||ms.fim)return;ms.fim=true;state.game="q";
  var rating=ms.err===0?3:ms.err<=2?2:1,prev=TR.done[ms.id]||0,bonus=prev?(rating>prev?rating-prev:0)+1:2+rating;
  var lib0=planetasLib();
  ms.rating=rating;ms.bonus=bonus;ms.novo=!prev;addStars(bonus);TR.done[ms.id]=Math.max(prev,rating);saveTR();
  ms.planeta=planetasLib()>lib0?planetasLib():0;if(ms.planeta)setTimeout(function(){toast("🪐 Você liberou o planeta "+ms.planeta+" na área Criar!");},400);diaAdd(ms.sub);
}
function qWin(){var ms=G.ms,q=ms.q;q.ok=true;ms.n++;stat(skKey(ms),"ok");
  if(q.first){ms.first++;addStars(1);diaAdd("acertos");ms.streak++;if(ms.streak>=3&&ms.boost<1){ms.boost++;ms.streak=0;}}
}
function qMiss(v){var ms=G.ms,q=ms.q;if(q.wrong.indexOf(v)<0)q.wrong.push(v);q.first=false;q.miss++;ms.err++;ms.streak=0;stat(skKey(ms),"err");
  if(q.miss===2&&ms.boost>-1)ms.boost--;}
function msBar(){var ms=G.ms;if(!ms)return "";var pp="";for(var i=0;i<ms.need;i++)pp+='<i class="'+(i<ms.n?"on":"")+'"></i>';
  return '<div class="msbar"><span>'+ANOS[ms.m[0]]+' · missão '+(ms.k+1)+'</span><span class="pips" role="img" aria-label="'+ms.n+' de '+ms.need+' acertos">'+pp+'</span></div>';}
function qHtml(top,nxt){
  var ms=G.ms;if(!ms)return "";var head=top(ms.fim?"Missão cumprida":mNome(ms.m));
  if(ms.fim){var nk=ms.k+1<TRILHAS[ms.sub].length&&mOpen(ms.sub,ms.k+1)?ms.k+1:-1,ganho=ms.first+ms.bonus;
    return head+'<div class="result">'+stars3(ms.rating)+'<h2 class="say" id="say-nome">'+(ms.rating===3?"Perfeito!":ms.rating===2?"Muito bem!":"Missão cumprida!")+'</h2>'+
      (ms.planeta?'<p class="done say" id="say-f0" style="margin:0 0 10px">Você liberou um planeta novo! Vá em Criar para montar o planeta '+ms.planeta+'.</p>':'')+
      '<p class="lead say" id="say-lead">Você ganhou '+stTxt(ganho)+' nesta missão.'+(ms.rating<3?" Jogue de novo sem errar para ganhar 3 estrelas.":"")+'</p></div>'+
      '<div class="nav">'+(nk>=0?'<button type="button" class="btn go" id="ms-next" data-g="ms-go" data-v="'+ms.sub+':'+nk+'">Próxima missão →</button>':'')+
      '<button type="button" class="btn" id="ms-again" data-g="ms-go" data-v="'+ms.sub+':'+ms.k+'">Jogar de novo</button><button type="button" class="btn" id="ms-trail" data-g="trail" data-v="'+ms.sub+'">Ver a trilha</button></div>';}
  var q=ms.q,short=q.opts&&q.opts.every(function(o){return String(o).length<=3;}),body="";
  if(q.txt)body+='<div class="txtbox say" id="say-t">'+esc(q.txt)+'</div>';
  body+='<p class="lead say" id="say-q">'+esc(q.say)+'</p>';
  if(q.big)body+='<p class="bigword'+(q.big.length>14?" long":"")+'">'+esc(q.big)+'</p>';
  if(q.vis)body+=q.vis;
  if(q.ok){var last=ms.n>=ms.need;body+='<p class="done say" id="say-fb">'+(q.first?"Isso! ":"Agora sim! ")+esc(q.fb||("A resposta é "+q.ans+"."))+'</p>'+nxt("q-next",last?"Ver o resultado →":"Próxima →");}
  else{if(q.miss)body+='<p class="say" id="say-f0" style="margin:0 0 8px">Ainda não. Tente '+(q.kb?"de novo":"outra")+'.</p>';
    if(q.kb)body+='<form class="gform" id="q-form"><label for="q-in" style="position:absolute;left:-9999px">Sua resposta</label><input type="text" inputmode="numeric" autocomplete="off" id="q-in" maxlength="9"><button type="submit" class="btn go" id="q-ok">Confirmar</button></form>';
    else if(short)body+='<div class="tiles">'+q.opts.map(function(c,k){return '<button type="button" class="tile big" id="qo-'+k+'" data-g="q-pick" data-v="'+esc(c)+'"'+(q.wrong.indexOf(c)>=0?" disabled":"")+'>'+esc(c)+'</button>';}).join("")+'</div>';
    else body+='<div class="opts'+(q.opts.length===3?" three":"")+'">'+q.opts.map(function(c,k){return '<button type="button" class="opt word'+(String(c).length>24?" longopt":"")+'" id="qo-'+k+'" data-g="q-pick" data-v="'+esc(c)+'"'+(q.wrong.indexOf(c)>=0?" disabled":"")+'>'+esc(c)+'</button>';}).join("")+'</div>';}
  return head+msBar()+body;
}
function qAnswer(v){var ms=G.ms;if(!ms||ms.fim||!ms.q||ms.q.ok)return;var q=ms.q,okv=q.kb?String(v).replace(/\D/g,"")===String(q.ans).replace(/\D/g,""):String(v)===String(q.ans);
  if(!String(v).trim())return;
  if(okv){qWin();redraw("g-next");speakPanel();buddy("happy",2200);}
  else{qMiss(String(v));redraw(q.kb?"q-in":null);speakFree(q.word&&!q.kb?"Aí está escrito: "+String(v).toLowerCase()+". Tente outra.":"Ainda não. Tente "+(q.kb?"de novo.":"outra."));}}
document.addEventListener("submit",function(ev){if(ev.target&&ev.target.id==="q-form"){ev.preventDefault();var i=$("q-in");if(i)qAnswer(i.value);}});
function trailGo(v){var p=String(v).split(":");if(mOpen(p[0],+p[1]))startMission(p[0],+p[1]);}

    '<p class="note">As missões ficam mais difíceis conforme a criança acerta, do pré ao 5º ano, seguindo a BNCC. Na área dos pais dá para escolher o ano escolar de onde começar.</p>';

function trailHtml(top,sub){
  var L=TRILHAS[sub],cur=mNext(sub),out=top("Trilha de "+subNome(sub))+'<p class="lead say" id="say-lead">'+mCount(sub)+' de '+L.length+' missões cumpridas. Toque numa missão aberta para jogar.</p>',ano=-1;
  L.forEach(function(m,k){if(m[0]!==ano){if(ano>=0)out+='</div>';ano=m[0];out+='<h3 class="grp">'+ANOS[ano]+'</h3><div class="trail">';}
    var op=mOpen(sub,k),dn=mDone(sub,k);
    out+='<button type="button" class="tstep'+(dn?" done":"")+(k===cur?" cur":"")+'" id="ts-'+sub+'-'+k+'" data-g="ms-go" data-v="'+sub+':'+k+'"'+(op?"":" disabled")+' aria-label="Missão '+(k+1)+': '+esc(mNome(m))+(op?"":", fechada")+'">'+

  if(act==="q-pick"){qAnswer(v);return;}
  if(act==="q-next"){var msq=G.ms;if(!msq)return;if(msq.n>=msq.need)finishMission();else newQ();renderDock();redraw();panel.scrollTop=0;announce();return;}

  if(/-(next|new)$/.test(act))applyUp();

  var miss=function(g,val){errStat();if(g.wrong.indexOf(val)<0)g.wrong.push(val);};
  if(act==="rank"){var rk=RANKS[+v];speakFree(rk[1]+". "+(G.stars>=rk[0]?"Você já conquistou essa patente.":"Precisa de "+rk[0]+" estrelas."));}

  }else if(act==="p-next"){newWord();redraw();announce();}

  }else if(act==="m-new"){newMemory();redraw();speakPanel();}

function me0(){return PROF.list.filter(function(q){return q.id===PROF.cur;})[0]||PROF.list[0];}

function paisAct(a,v,t){
  if(a==="open"){askGate(openPais);}
  else if(a==="gclose"){GATE=null;ovl("gate",false);}
  else if(a==="close"){ovl("pais",false);if(!$("rest").hidden){var L=limitToday();if(!L||playedToday()<L)ovl("rest",false);}renderPanel();}

  else if(a==="use"){usePerfil(v);}
  else if(a==="add"){var n=PROF.list.length+1;PROF.list.push({id:"p"+Date.now().toString(36),nome:"Jogador "+n});PROF.set("mss:profiles",PROF.list);AC.marcar("_familia");paisRedraw("pa-add");}
  else if(a==="del"){if(PA.del!==v){PA.del=v;paisRedraw(t.id);return;}
    PROF.del("mss:"+v+":");PROF.list=PROF.list.filter(function(q){return q.id!==v;});PROF.set("mss:profiles",PROF.list);AC.apagarPerfil(v);PA.del=null;
    if(v===PROF.cur)usePerfil(PROF.list[0].id);else paisRedraw();}
  else if(a==="export"){var out={perfil:me0(),exportado_em:new Date().toISOString(),dados:{}},pre="mss:"+PROF.cur+":";
    try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf(pre)===0)out.dados[k.slice(pre.length)]=JSON.parse(localStorage.getItem(k));}}catch(e){}
    var blob=new Blob([JSON.stringify(out,null,2)],{type:"application/json"}),u=URL.createObjectURL(blob),an=document.createElement("a");
    an.href=u;an.download="missao-sistema-solar-"+(me0().nome||"perfil").replace(/[^\w-]+/g,"-")+".json";document.body.appendChild(an);an.click();an.remove();setTimeout(function(){URL.revokeObjectURL(u);},2000);}

  else if(a==="extra"){var ex=(SET.extra&&SET.extra.d===dayKey())?SET.extra.m:0;SET.extra={d:dayKey(),m:ex+15};store.set("set",SET);ovl("rest",false);paisRedraw();}
  else if(a==="rate"){SET.rate=+v;RATE=+v;store.set("set",SET);paisRedraw(t.id);}
  else if(a==="ano"){TR.inicio=+v;saveTR();paisRedraw(t.id);}

    scene.updateMatrixWorld(true);
    objs.forEach(function(o){o.pivot.getWorldPosition(o.pos);});
    if(MY.on)myTick(dt);

    var cs=state.sel>=0?state.sel:state.focus,goal=MY.on?(MY.fpos?v.copy(MY.fpos):v.set(0,0,0)):(cs<0?v.set(0,0,0):v.copy(objs[cs].pos));
    if(fly.t<1){fly.t=Math.min(1,fly.t+dt/fly.dur);var e=fly.t<.5?4*fly.t*fly.t*fly.t:1-Math.pow(-2*fly.t+2,3)/2;
      target.lerpVectors(fly.from,goal,e);if(!fly.userZoom)radius=fly.r0+(fly.r1-fly.r0)*e;
      if(fly.a1){theta=fly.a0.theta+fly.dth*e;phi=fly.a0.phi+(fly.a1.phi-fly.a0.phi)*e;}}
    else target.copy(goal);
    if(MY.on&&MY.mode==='land'){wantX=0;wantY=0;}
    offX+=(wantX-offX)*Math.min(1,dt*5);offY+=(wantY-offY)*Math.min(1,dt*5);
    camera.setViewOffset(W,H,offX,offY,W,H);
    if(MY.on&&MY.mode==="pilot")pilotTick(dt);
    else if(MY.on&&MY.mode==="land")landTick(dt,now);
    else{var sp=Math.sin(phi);
      camera.position.set(target.x+radius*sp*Math.sin(theta),target.y+radius*Math.cos(phi),target.z+radius*sp*Math.cos(theta));
      camera.lookAt(target);}
    camera.updateMatrixWorld(true);
    renderer.render(MY.on&&MY.mode==='land'&&LS.scene?LS.scene:scene,camera);

    var pxPer=(H/2)/TAN;
    for(var i=0;i<objs.length;i++){var o=objs[i],el=tags[i],d=camera.position.distanceTo(o.pos);
      v.copy(o.pos).project(camera);
      var hide=MY.on||v.z>1||v.z<-1||i===state.sel&&fly.t>.6||(o.b.id==="lua"&&d>120)||(o.b.id==="iss"&&d>60)||d<o.b.r*1.2||(!o.b.grupo&&d>(REALM?2600:900));
      if(hide){if(el.style.display!=="none")el.style.display="none";continue;}
      if(el.style.display==="none")el.style.display="";
      var sx=(v.x*.5+.5)*W,sy=(-v.y*.5+.5)*H-(o.b.grupo==="const"?Math.min(150,o.b.size*.55/d*pxPer):o.b.r/d*pxPer)-8;
      el.style.transform="translate("+sx.toFixed(1)+"px,"+sy.toFixed(1)+"px) translate(-50%,-100%)";
    }
    for(var mi=0;mi<MY.tags.length;mi++){var mq=MY.pl[mi],me=MY.tags[mi],ms=!!mq&&MY.mode==="build"&&!(mi===MY.focus&&fly.t>.6);
      if(ms){v.copy(mq.pos).project(camera);ms=v.z<1&&v.z>-1;}
      if(!ms){if(me.style.display!=="none")me.style.display="none";continue;}
      if(me.style.display==="none")me.style.display="";
      me.style.transform="translate("+((v.x*.5+.5)*W).toFixed(1)+"px,"+((-v.y*.5+.5)*H-mq.rad/camera.position.distanceTo(mq.pos)*pxPer-8).toFixed(1)+"px) translate(-50%,-100%)";}
    for(var m=0;m<miniTags.length;m++){var mt=miniTags[m],show=mt.i===state.sel&&fly.t>.55;
      if(show){v.copy(mt.pos).project(camera);show=v.z<1&&v.z>-1;}
      if(!show){if(mt.el.style.display!=="none")mt.el.style.display="none";continue;}
      if(mt.el.style.display==="none")mt.el.style.display="";
      mt.el.style.transform="translate("+((v.x*.5+.5)*W).toFixed(1)+"px,"+((-v.y*.5+.5)*H-12).toFixed(1)+"px) translate(-50%,-100%)";}
    if(!reduce)for(var q=0;q<twinkle.length;q++)twinkle[q].opacity=.72+.28*Math.sin(now*.001*(1.3+q*.55)+q*2.1);
    var days=Math.floor(simDays),yrs=Math.floor(days/365.25),txt=yrs>=1?"Passou "+fmt(yrs)+(yrs===1?" ano":" anos")+" na Terra":"Passou "+days+(days===1?" dia":" dias")+" na Terra";
    if(yrs>1)txt="Passaram "+fmt(yrs)+" anos na Terra";
    if(txt!==lastElapsed){elapsedEl.textContent=txt;lastElapsed=txt;}
    requestAnimationFrame(frame);
  }
  measure();radius=overviewR();fly.r1=radius;offX=wantX;offY=wantY;
  if(state.sel>=0){target.copy(objs[state.sel].pivot.position);flyTo(state.sel);}
  requestAnimationFrame(frame);
}

/* ---------- Início ---------- */
function start(saved){
  if(saved&&typeof saved.sel==="number"&&saved.sel>=-1&&saved.sel<BODIES.length){state.sel=saved.sel;if(state.sel>=0)state.tab=tabOf(BODIES[state.sel]);}
  applyCaps();renderBuddy();try{initBud3D();}catch(e){bud3d=null;renderBuddy();}
  renderDock();renderPanel();
  try{boot3D();}
  catch(e){
    if(window.console)console.warn("3D indisponível:",e&&e.message);
    $("sky").style.display="none";
    var p=document.createElement("p");p.className="fail";p.textContent="Este aparelho não conseguiu abrir o espaço em 3D. Os cartões dos planetas continuam funcionando: escolha um na fila aqui embaixo.";
    stage.insertBefore(p,stage.firstChild);
  }
  if(hot&&hot.snapshot)hot.snapshot(function(){return {sel:state.sel};});
  AC.boot(function(){if(PROF.list.length>1&&!pickedNow())showWho();else checkLimit();});
}
if(hot&&hot.ready)hot.ready(start);else start((hot&&hot.data)||{});
})();
</script>
